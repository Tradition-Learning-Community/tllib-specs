test_plan_id: TLC-TP-TLC-FC-09-VALUES-003
feature_id: TLC-FC-09-VALUES-003
contract_id: TLC-MC-TLC-FC-09-VALUES-003
ir_id: TLC-IR-TLC-FC-09-VALUES-003
entrypoint: assemble_admissible_value_dynamics_ast
primary_operation: Bind cited equation expressions to their source objects while preserving their declared order
  and dynamic role.
inputs_under_test:
- 'equations: Sequence[SymbolicDynamicsEquation]'
- 'symbols: SymbolTable'
expected_output_or_effect: 'dynamics_ast: AdmissibleValueDynamicsAst'
cases:
- case_id: VALUES-003-NOMINAL
  kind: nominal
  assertion: 'assemble_admissible_value_dynamics_ast produces dynamics_ast: AdmissibleValueDynamicsAst from valid
    source-addressable inputs.'
- case_id: VALUES-003-TYPE-SHAPE
  kind: type_or_shape
  assertion: Operation-specific required input roles and container shapes are validated before construction.
- case_id: VALUES-003-OBSERVABLE
  kind: observable_result
  assertion: The dynamics_ast exposes the operation-specific structure described by the contract.
- case_id: VALUES-003-POST
  kind: postcondition
  assertion: The dynamics_ast is produced by assemble_admissible_value_dynamics_ast without scientific evaluation.
- case_id: VALUES-003-PRECONDITION
  kind: invalid_precondition
  assertion: 'An invalid required input returns one of: missing_equation_source, unbound_symbol, duplicate_equation_role.'
- case_id: VALUES-003-OPAQUE
  kind: opaque_value
  assertion: Opaque payloads survive construction unchanged and are never scientifically evaluated.
- case_id: VALUES-003-PROVENANCE
  kind: provenance
  assertion: Output retains feature TLC-FC-09-VALUES-003 and all covered object and relation identifiers.
- case_id: VALUES-003-UNRESOLVED
  kind: unresolved_propagation
  assertion: 'Output retains unresolved items: state_domains, initial_conditions, solver_and_discretization.'
- case_id: VALUES-003-ASSUMPTION
  kind: assumption_propagation
  assertion: Output retains provisional assumption TLC-EA-TLC-FC-09-VALUES-003-001.
- case_id: VALUES-003-NO-INVENTION
  kind: scientific_non_evaluation
  assertion: No absent formula, scale, ordering, threshold, aggregation, or scientific result is computed.
- case_id: VALUES-003-CONFORMANCE
  kind: contract_ir_conformance
  assertion: Entrypoint, inputs, output, errors, unresolved, assumption, classification, and readiness match.
- case_id: VALUES-003-INTEGRATION
  kind: minimal_integration
  assertion: Contract loader -> IR entrypoint -> provenance serializer preserves operation-specific structure.
forbidden_expected_results:
- invented numeric oracle
- scientific approval
- canonical semantics
readiness: planned
