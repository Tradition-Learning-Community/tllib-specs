scope: feature-specific functional tests for constructing CapacityHamiltonianAst while
  preserving blocker reservations and forbidding scientific evaluation
test_cases:
- name: nominal_constructs_feature_specific_artifact
  given: feature TLC-FC-11-CAPACITIES-007, ordered objects TLC-SO-CAPACITIES-098,
    explicit symbol table, provenance, and decision_blocker scientific decision required
  when: call capacities_construct_hamiltonian_capacity_dynamics_ast_007
  then: returns CapacityHamiltonianAst; AST root contains opaque kinetic, potential,
    Phi-coupling, and Psi-coupling child labels when present in the cited symbols/source
    payload
- name: rejects_wrong_object_order_or_membership
  given: the object list omits, adds, or reorders one of TLC-SO-CAPACITIES-098
  when: call capacities_construct_hamiltonian_capacity_dynamics_ast_007
  then: raises MissingCoveredObject, UnexpectedCoveredObject, or ObjectOrderMismatch
    before construction
- name: requires_symbol_table_entries
  given: a covered object has no symbol_table entry
  when: call capacities_construct_hamiltonian_capacity_dynamics_ast_007
  then: raises MissingSymbolTableEntry even when the source symbols list would be
    empty
- name: preserves_opaque_payloads
  given: opaque payload objects with uninterpreted source_statement values
  when: call capacities_construct_hamiltonian_capacity_dynamics_ast_007
  then: artifact exposes object ids and symbols but does not inspect or rewrite payload
    semantics
- name: preserves_provenance_per_object
  given: source references for each covered object
  when: call capacities_construct_hamiltonian_capacity_dynamics_ast_007
  then: artifact query by object id returns the same source_path, line span, section,
    and commit
- name: propagates_decision_blocker_and_assumption
  given: decision_blocker scientific decision required and provisional opaque-payload
    assumption
  when: call capacities_construct_hamiltonian_capacity_dynamics_ast_007
  then: artifact contains the blocker and propagated_provisional_assumptions unchanged
- name: rejects_scientific_evaluation_requests
  given: caller asks to solve, optimize, score, rank, aggregate, evaluate a metric,
    decide a threshold, infer progression, or infer causality
  when: non-evaluation guard is invoked
  then: raises ScientificEvaluationRequested and returns no numeric or truth-valued
    scientific result
- name: contract_ir_alignment
  given: the modified contract and IR
  when: compare entrypoint, primary operation, inputs, outputs, errors, blocker propagation,
    and postconditions
  then: contract and IR describe the same CapacityHamiltonianAst construction behavior
postconditions_under_test:
- output type is CapacityHamiltonianAst
- AST root contains opaque kinetic, potential, Phi-coupling, and Psi-coupling child
  labels when present in the cited symbols/source payload
- output object order equals TLC-SO-CAPACITIES-098
- output provenance is copied for every covered object
- output propagated_unresolved includes scientific decision required
- output readiness guard prevents scientific evaluation while allowing structural
  construction
- no score, level, ranking, metric value, threshold decision, probability, progression,
  learning rule, causal claim, aggregation result, or scientific formula result is
  produced
opaque_value_tests:
- payload identity and symbols are preserved as opaque values; scientific semantics
  are not inspected
provenance_tests:
- every output object supports provenance lookup by object id
integration_tests:
- construct CapacityHamiltonianAst via capacities_construct_hamiltonian_capacity_dynamics_ast_007,
  store it in a prototype registry keyed by TLC-FC-11-CAPACITIES-007, and query its
  symbolic components without evaluation
non_goals:
- no scientific numeric expectation
- no score, ranking, threshold decision, aggregation, or progression
- no resolution of scientific decision required blocker
readiness_expectation:
  ready_for_reference_python: true
  ready_for_cpp_prototype: true
  ready_for_canonical_ir: false
  ready_for_production_implementation: false
  blocks_all_prototype_progress: false
