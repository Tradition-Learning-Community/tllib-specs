test_plan_id: TLC-TP-TLC-FC-09-VALUES-007
feature_id: TLC-FC-09-VALUES-007
contract_id: TLC-MC-TLC-FC-09-VALUES-007
ir_id: TLC-IR-TLC-FC-09-VALUES-007
entrypoint: compile_validity_domain_membership_ast
primary_operation: Represent the tuple components and named membership predicates without deciding the opaque carrier
  sets.
inputs_under_test:
- 'domain_expression: SymbolicSetExpression'
- 'tuple_symbols: Sequence[SymbolId]'
expected_output_or_effect: 'membership_ast: ValidityDomainMembershipAst'
cases:
- case_id: VALUES-007-NOMINAL
  kind: nominal
  assertion: 'compile_validity_domain_membership_ast produces membership_ast: ValidityDomainMembershipAst from valid
    source-addressable inputs.'
- case_id: VALUES-007-TYPE-SHAPE
  kind: type_or_shape
  assertion: Operation-specific required input roles and container shapes are validated before construction.
- case_id: VALUES-007-OBSERVABLE
  kind: observable_result
  assertion: The membership_ast exposes the operation-specific structure described by the contract.
- case_id: VALUES-007-POST
  kind: postcondition
  assertion: The membership_ast is produced by compile_validity_domain_membership_ast without scientific evaluation.
- case_id: VALUES-007-PRECONDITION
  kind: invalid_precondition
  assertion: 'An invalid required input returns one of: missing_tuple_component, unknown_membership_predicate, expression_parse_error.'
- case_id: VALUES-007-OPAQUE
  kind: opaque_value
  assertion: Opaque payloads survive construction unchanged and are never scientifically evaluated.
- case_id: VALUES-007-PROVENANCE
  kind: provenance
  assertion: Output retains feature TLC-FC-09-VALUES-007 and all covered object and relation identifiers.
- case_id: VALUES-007-UNRESOLVED
  kind: unresolved_propagation
  assertion: 'Output retains unresolved items: carrier_set_definitions, membership_evaluation_policy.'
- case_id: VALUES-007-ASSUMPTION
  kind: assumption_propagation
  assertion: Output retains provisional assumption TLC-EA-TLC-FC-09-VALUES-007-001.
- case_id: VALUES-007-NO-INVENTION
  kind: scientific_non_evaluation
  assertion: No absent formula, scale, ordering, threshold, aggregation, or scientific result is computed.
- case_id: VALUES-007-CONFORMANCE
  kind: contract_ir_conformance
  assertion: Entrypoint, inputs, output, errors, unresolved, assumption, classification, and readiness match.
- case_id: VALUES-007-INTEGRATION
  kind: minimal_integration
  assertion: Contract loader -> IR entrypoint -> provenance serializer preserves operation-specific structure.
forbidden_expected_results:
- invented numeric oracle
- scientific approval
- canonical semantics
readiness: planned
