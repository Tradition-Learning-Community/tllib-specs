test_plan_id: TLC-TP-TLC-FC-09-VALUES-013
feature_id: TLC-FC-09-VALUES-013
contract_id: TLC-MC-TLC-FC-09-VALUES-013
ir_id: TLC-IR-TLC-FC-09-VALUES-013
entrypoint: bind_value_function_operator_descriptors
primary_operation: Create four distinct callable-descriptor entries without assigning signatures or evaluating them.
inputs_under_test:
- 'descriptors: Mapping[ValueOperatorRole, OpaqueOperatorDescriptor]'
expected_output_or_effect: 'registry: ValueOperatorRegistry'
cases:
- case_id: VALUES-013-NOMINAL
  kind: nominal
  assertion: 'bind_value_function_operator_descriptors produces registry: ValueOperatorRegistry from valid source-addressable
    inputs.'
- case_id: VALUES-013-TYPE-SHAPE
  kind: type_or_shape
  assertion: Operation-specific required input roles and container shapes are validated before construction.
- case_id: VALUES-013-OBSERVABLE
  kind: observable_result
  assertion: The registry exposes the operation-specific structure described by the contract.
- case_id: VALUES-013-POST
  kind: postcondition
  assertion: The registry is produced by bind_value_function_operator_descriptors without scientific evaluation.
- case_id: VALUES-013-PRECONDITION
  kind: invalid_precondition
  assertion: 'An invalid required input returns one of: missing_operator_role, duplicate_operator_role, descriptor_source_mismatch.'
- case_id: VALUES-013-OPAQUE
  kind: opaque_value
  assertion: Opaque payloads survive construction unchanged and are never scientifically evaluated.
- case_id: VALUES-013-PROVENANCE
  kind: provenance
  assertion: Output retains feature TLC-FC-09-VALUES-013 and all covered object and relation identifiers.
- case_id: VALUES-013-UNRESOLVED
  kind: unresolved_propagation
  assertion: 'Output retains unresolved items: operator_signatures, numeric_representation, return_semantics.'
- case_id: VALUES-013-ASSUMPTION
  kind: assumption_propagation
  assertion: Output retains provisional assumption TLC-EA-TLC-FC-09-VALUES-013-001.
- case_id: VALUES-013-NO-INVENTION
  kind: scientific_non_evaluation
  assertion: No absent formula, scale, ordering, threshold, aggregation, or scientific result is computed.
- case_id: VALUES-013-CONFORMANCE
  kind: contract_ir_conformance
  assertion: Entrypoint, inputs, output, errors, unresolved, assumption, classification, and readiness match.
- case_id: VALUES-013-INTEGRATION
  kind: minimal_integration
  assertion: Contract loader -> IR entrypoint -> provenance serializer preserves operation-specific structure.
forbidden_expected_results:
- invented numeric oracle
- scientific approval
- canonical semantics
readiness: planned
