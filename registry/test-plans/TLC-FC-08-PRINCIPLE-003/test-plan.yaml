schema_version: 1
test_plan_id: TLC-TP-TLC-FC-08-PRINCIPLE-003-PROTOTYPE-001
feature_id: TLC-FC-08-PRINCIPLE-003
contract_id: TLC-MC-TLC-FC-08-PRINCIPLE-003
ir_id: TLC-IR-TLC-FC-08-PRINCIPLE-003-PROTOTYPE-001
entrypoint: construct_principle_equation_catalog
primary_operation: Construct a source-ordered catalogue of the formalization, stability, composition, and progressive-convergence
  equation ASTs.
inputs_under_test:
- PrincipleEquationSymbols
expected_output: PrincipleEquationCatalog
tests:
- id: TEST-003-NOMINAL
  category: nominal
  invokes: construct_principle_equation_catalog
  scenario: Supply valid opaque identifiers for PrincipleEquationSymbols.
  expected: Produces four immutable equation ASTs keyed by their scientific object IDs with no equation evaluation.
- id: TEST-003-SHAPE
  category: type_and_shape
  invokes: construct_principle_equation_catalog
  scenario: Construct from valid ordered inputs.
  expected: 'Result type is PrincipleEquationCatalog and templates equal [''equivalent(discourse succeeds_under principle
    message, member(message, set(message_prime | principle_predicate(discourse, message_prime))))'', ''implies(similar(discourse_1,
    discourse_2), similar(message_1, message_2))'', ''and(equals(composite_discourses, intersect(principle_1_discourses, principle_2_discourses)),
    equivalent(discourse succeeds_under composite_principle message, exists intermediate_message: discourse succeeds_under
    principle_1 intermediate_message and intermediate_message succeeds_under principle_2 message))'', ''equals(final_message,
    limit(time_to_infinity, interpretation_operator(principles, discourses, message_at_time)))''].'
- id: TEST-003-EFFECT
  category: observable_effect
  invokes: construct_principle_equation_catalog
  scenario: Inspect the returned immutable result.
  expected: Produces four immutable equation ASTs keyed by their scientific object IDs with no equation evaluation.
- id: TEST-003-POST
  category: postcondition
  invokes: construct_principle_equation_catalog
  scenario: Construct twice from identical ordered identifiers.
  expected: Results are structurally equal and retain identical traceability.
- id: TEST-003-PRE
  category: invalid_precondition
  invokes: construct_principle_equation_catalog
  scenario: Omit one required opaque identifier.
  expected_error: ERR-PRINCIPLE-003-MISSING
- id: TEST-003-ERROR
  category: error_policy
  invokes: construct_principle_equation_catalog
  scenario: Duplicate a covered scientific object ID.
  expected_error: ERR-PRINCIPLE-003-DUPLICATE
- id: TEST-003-OPAQUE
  category: opaque_value
  invokes: construct_principle_equation_catalog
  scenario: 'Use identifiers with no runtime scientific implementation; boundary: Set domains, similarity, predicate behavior,
    composition law, limit existence, topology, convergence, and operator implementations remain opaque.'
  expected: Construction succeeds without dereferencing or evaluating opaque values.
- id: TEST-003-PROVENANCE
  category: provenance
  invokes: construct_principle_equation_catalog
  scenario: Construct with all cited object IDs and source ranges.
  expected: Every output node retains its exact object ID and source range.
- id: TEST-003-UNRESOLVED
  category: unresolved_propagation
  invokes: construct_principle_equation_catalog
  scenario: Construct with the contract unresolved set.
  expected: Output unresolved set equals [] and no item is resolved.
- id: TEST-003-ASSUMPTION
  category: assumption_propagation
  invokes: construct_principle_equation_catalog
  scenario: Construct with the provisional representation assumption.
  expected: Output assumption set equals [TLC-EA-PRINCIPLE-003-001].
- id: TEST-003-NO-SCIENCE
  category: non_evaluation
  invokes: construct_principle_equation_catalog
  scenario: Request only the defined construction operation.
  expected: No numeric, logical, stochastic, metric, relational, differential, or scientific truth value is calculated.
- id: TEST-003-CONFORMANCE
  category: contract_ir_conformance
  invokes: construct_principle_equation_catalog
  scenario: Compare contract and IR interface, templates, errors, postconditions, classification, and readiness.
  expected: All fields agree exactly.
- id: TEST-003-INTEGRATION
  category: minimal_integration
  invokes: construct_principle_equation_catalog
  scenario: Resolve feature, contract, IR, and test plan by stable IDs.
  expected: The four artifacts form one unambiguous active chain.
implementation_status: ready_for_specific_test_implementation
