test_plan_id: TLC-TP-TLC-FC-09-VALUES-012
feature_id: TLC-FC-09-VALUES-012
contract_id: TLC-MC-TLC-FC-09-VALUES-012
ir_id: TLC-IR-TLC-FC-09-VALUES-012
entrypoint: declare_value_space_structure
primary_operation: Index each named space or structure and preserve declared containment or association edges.
inputs_under_test:
- 'spaces: Sequence[OpaqueSpaceDeclaration]'
- 'edges: Sequence[SymbolicStructureEdge]'
expected_output_or_effect: 'structure: ValueSpaceStructure'
cases:
- case_id: VALUES-012-NOMINAL
  kind: nominal
  assertion: 'declare_value_space_structure produces structure: ValueSpaceStructure from valid source-addressable
    inputs.'
- case_id: VALUES-012-TYPE-SHAPE
  kind: type_or_shape
  assertion: Operation-specific required input roles and container shapes are validated before construction.
- case_id: VALUES-012-OBSERVABLE
  kind: observable_result
  assertion: The structure exposes the operation-specific structure described by the contract.
- case_id: VALUES-012-POST
  kind: postcondition
  assertion: The structure is produced by declare_value_space_structure without scientific evaluation.
- case_id: VALUES-012-PRECONDITION
  kind: invalid_precondition
  assertion: 'An invalid required input returns one of: duplicate_space_identifier, edge_endpoint_missing, unknown_structure_edge.'
- case_id: VALUES-012-OPAQUE
  kind: opaque_value
  assertion: Opaque payloads survive construction unchanged and are never scientifically evaluated.
- case_id: VALUES-012-PROVENANCE
  kind: provenance
  assertion: Output retains feature TLC-FC-09-VALUES-012 and all covered object and relation identifiers.
- case_id: VALUES-012-UNRESOLVED
  kind: unresolved_propagation
  assertion: 'Output retains unresolved items: space_dimensions, topology_and_metric, edge_semantics.'
- case_id: VALUES-012-ASSUMPTION
  kind: assumption_propagation
  assertion: Output retains provisional assumption TLC-EA-TLC-FC-09-VALUES-012-001.
- case_id: VALUES-012-NO-INVENTION
  kind: scientific_non_evaluation
  assertion: No absent formula, scale, ordering, threshold, aggregation, or scientific result is computed.
- case_id: VALUES-012-CONFORMANCE
  kind: contract_ir_conformance
  assertion: Entrypoint, inputs, output, errors, unresolved, assumption, classification, and readiness match.
- case_id: VALUES-012-INTEGRATION
  kind: minimal_integration
  assertion: Contract loader -> IR entrypoint -> provenance serializer preserves operation-specific structure.
forbidden_expected_results:
- invented numeric oracle
- scientific approval
- canonical semantics
readiness: planned
