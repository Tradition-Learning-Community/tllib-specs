test_plan_id: TLC-TP-TLC-FC-09-VALUES-010
feature_id: TLC-FC-09-VALUES-010
contract_id: TLC-MC-TLC-FC-09-VALUES-010
ir_id: TLC-IR-TLC-FC-09-VALUES-010
entrypoint: assemble_essential_property_predicates
primary_operation: Produce an ordered property set covering invariance, hierarchy, motivation, context, and integration.
inputs_under_test:
- 'property_claims: Mapping[EssentialPropertyKind, SymbolicClaim]'
expected_output_or_effect: 'predicates: EssentialPropertyPredicateSet'
cases:
- case_id: VALUES-010-NOMINAL
  kind: nominal
  assertion: 'assemble_essential_property_predicates produces predicates: EssentialPropertyPredicateSet from valid
    source-addressable inputs.'
- case_id: VALUES-010-TYPE-SHAPE
  kind: type_or_shape
  assertion: Operation-specific required input roles and container shapes are validated before construction.
- case_id: VALUES-010-OBSERVABLE
  kind: observable_result
  assertion: The predicates exposes the operation-specific structure described by the contract.
- case_id: VALUES-010-POST
  kind: postcondition
  assertion: The predicates is produced by assemble_essential_property_predicates without scientific evaluation.
- case_id: VALUES-010-PRECONDITION
  kind: invalid_precondition
  assertion: 'An invalid required input returns one of: missing_property_kind, duplicate_property_kind, unknown_property_kind.'
- case_id: VALUES-010-OPAQUE
  kind: opaque_value
  assertion: Opaque payloads survive construction unchanged and are never scientifically evaluated.
- case_id: VALUES-010-PROVENANCE
  kind: provenance
  assertion: Output retains feature TLC-FC-09-VALUES-010 and all covered object and relation identifiers.
- case_id: VALUES-010-UNRESOLVED
  kind: unresolved_propagation
  assertion: 'Output retains unresolved items: property_evaluation_semantics, cross_property_consistency.'
- case_id: VALUES-010-ASSUMPTION
  kind: assumption_propagation
  assertion: Output retains provisional assumption TLC-EA-TLC-FC-09-VALUES-010-001.
- case_id: VALUES-010-NO-INVENTION
  kind: scientific_non_evaluation
  assertion: No absent formula, scale, ordering, threshold, aggregation, or scientific result is computed.
- case_id: VALUES-010-CONFORMANCE
  kind: contract_ir_conformance
  assertion: Entrypoint, inputs, output, errors, unresolved, assumption, classification, and readiness match.
- case_id: VALUES-010-INTEGRATION
  kind: minimal_integration
  assertion: Contract loader -> IR entrypoint -> provenance serializer preserves operation-specific structure.
forbidden_expected_results:
- invented numeric oracle
- scientific approval
- canonical semantics
readiness: planned
