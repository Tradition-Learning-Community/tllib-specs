contract_id: TLC-MC-TLC-FC-09-VALUES-009
ir_id: TLC-IR-TLC-FC-09-VALUES-009
entrypoint: compile_partial_invariance_predicate
primary_operation: Bind an opaque perturbation, radius symbol, and relative-order claim without evaluating norms
