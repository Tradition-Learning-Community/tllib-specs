- case_id: VALUES-009-ASSUMPTION
  kind: assumption_propagation
  assertion: Output retains provisional assumption TLC-EA-TLC-FC-09-VALUES-009-001.
- case_id: VALUES-009-NO-INVENTION
  kind: scientific_non_evaluation
