- 'radius: SymbolicBound'
- 'order_claim: SymbolicOrderClaim'
expected_output_or_effect: 'predicate: PartialInvariancePredicate'
cases:
- case_id: VALUES-009-NOMINAL
  kind: nominal
  assertion: 'compile_partial_invariance_predicate produces predicate: PartialInvariancePredicate from valid source-addressable
    inputs.'
- case_id: VALUES-009-TYPE-SHAPE
  kind: type_or_shape
  assertion: Operation-specific required input roles and container shapes are validated before construction.
- case_id: VALUES-009-OBSERVABLE
  kind: observable_result
  assertion: The predicate exposes the operation-specific structure described by the contract.
- case_id: VALUES-009-POST
  kind: postcondition
  assertion: The predicate is produced by compile_partial_invariance_predicate without scientific evaluation.
- case_id: VALUES-009-PRECONDITION
  kind: invalid_precondition
  assertion: 'An invalid required input returns one of: missing_radius_symbol, missing_order_claim, source_claim_mismatch.'
- case_id: VALUES-009-OPAQUE
  kind: opaque_value
  assertion: Opaque payloads survive construction unchanged and are never scientifically evaluated.
- case_id: VALUES-009-PROVENANCE
  kind: provenance
  assertion: Output retains feature TLC-FC-09-VALUES-009 and all covered object and relation identifiers.
- case_id: VALUES-009-UNRESOLVED
  kind: unresolved_propagation
