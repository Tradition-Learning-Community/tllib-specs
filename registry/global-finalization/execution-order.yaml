schema_version: 1
status: implementation_order_advisory_not_scientific
ordering_basis: explicit structural dependencies and availability of shared infrastructure
waves:
  - id: wave-0-shared-structural-foundation
    tasks: [feature identifiers, source references, opaque values, unresolved propagation, traceability, structured errors, serialization]
  - id: wave-1-independent-descriptors
    domains: [master, message, relations]
  - id: wave-2-domain-structural-modules
    domains: [community, huit-dimensions, invariants, theorems, principle, values, virtues]
  - id: wave-3-cross-domain-dependent-structural-modules
    domains: [disciple, dynamics, capacities, competencies, practice, lived-experience]
  - id: wave-4-bindings-and-integration-tests
    condition: all preceding structural acceptance oracles pass
constraints:
  - no scientific execution engine is implied
  - domain tasks remain authoritative for per-feature implementation
  - waves may execute in parallel when explicit dependencies permit
