schema_version: '1.0'
oracle_id: TLC-ORACLE-COMMUNITY-001
feature_id: TLC-FC-02-COMMUNITY-001
finalized_ir_ref: registry/optimized-ir/community/TLC-FC-02-COMMUNITY-001/ir.yaml
algorithm_ref: registry/algorithms/community/TLC-FC-02-COMMUNITY-001/algorithm.yaml
source_test_plan_ref: registry/test-plans/TLC-FC-02-COMMUNITY-001/test-plan.yaml
oracle_scope: structural_observables_only
scientific_values_created: false
cases:
- test_id: COMMUNITY-001-OR-001
  category: nominal
  stimulus: valid describe request
  assertions: [completed_state, exact_feature_id, exact_source_object, exact_source_refs, deterministic_serialization]
- test_id: COMMUNITY-001-OR-002
  category: precondition
  stimulus: mismatched feature ID
  expected_error: COMMUNITY_ERR_FEATURE_ID_MISMATCH
- test_id: COMMUNITY-001-OR-003
  category: source_traceability
  stimulus: missing candidate or supplemental IR reference
  expected_error: COMMUNITY_ERR_SOURCE_ARTIFACT_MISSING
- test_id: COMMUNITY-001-OR-004
  category: conservation
  stimulus: valid structural request
  assertions: [source_contract_unchanged, source_ir_unchanged, supplemental_ir_not_promoted, source_object_TLC-SO-COMMUNITY-008_preserved]
- test_id: COMMUNITY-001-OR-005
  category: unresolved_propagation
  stimulus: remove, add, duplicate or resolve one authoritative unresolved ID
  expected_error: COMMUNITY_ERR_UNRESOLVED_NOT_PRESERVED
- test_id: COMMUNITY-001-OR-006
  category: opaque_value_propagation
  stimulus: opaque measure, coherence, actor-domain and result handles
  assertions: [handles_returned_unchanged, no_comparison, no_evaluation, no_type_inference]
- test_id: COMMUNITY-001-OR-007
  category: unsupported_execution
  stimulus: scientific execution request
  expected_error: COMMUNITY_ERR_UNSUPPORTED_EXECUTION_REQUEST
- test_id: COMMUNITY-001-OR-008
  category: determinism
  stimulus: repeat identical request twice
  assertions: [structurally_equal_results, byte_equivalent_normalized_serialization]
- test_id: COMMUNITY-001-OR-009
  category: metamorphic
  stimulus: reorder irrelevant input metadata keys
  assertions: [same_normalized_result, source_object_order_unchanged]
- test_id: COMMUNITY-001-OR-010
  category: non_invention
  stimulus: inspect finalized output schema
  assertions: [no_new_equation, no_new_dimension, no_new_scientific_type, no_numerical_method]
properties:
- exact unresolved set is invariant under every successful operation
- source-object identity and order are invariant
- opaque values are observationally transported, never interpreted
- structural validation is pure and deterministic
composition_tests:
- feature registry dispatches 001 only to algorithm TLC-ALG-COMMUNITY-001
- result conforms to CommunitySpecificationResult
acceptance: all_cases_pass
