    category: opaque_propagation
    assertion: opaque input payload is copied without interpretation
  - test_id: TLC-FC-01-DISCIPLE-003-AT-006
    category: determinism
    assertion: preparation and execution refusal are deterministic
  - test_id: TLC-FC-01-DISCIPLE-003-AT-007
    category: dependency
    assertion: internal dependency on 009 remains declared
