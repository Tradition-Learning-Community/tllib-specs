  expected_error: FAIL-HUIT-001-OPERATION
- id: HD-001-TYPE
  category: type
  assertion: each role retains its declared opaque type without coercion
- id: HD-001-CARDINALITY
  category: cardinality
  assertion: result role count equals three
- id: HD-001-IDENTITY
  category: conservation
  assertion: all three scientific object identities remain distinct and unchanged
- id: HD-001-OPAQUE
  category: opaque_propagation
  assertion: opaque payload bytes round-trip unchanged
- id: HD-001-UNRESOLVED
  category: unresolved_propagation
  assertion: exact eight unresolved identifiers are present and unresolved
- id: HD-001-DETERMINISM
  category: determinism
  assertion: identical inputs produce structurally identical outputs
- id: HD-001-METAMORPHIC-ORDER
  category: metamorphic
  transformation: reorder the input map without changing role bindings
  assertion: named output slots and payloads remain identical
- id: HD-001-FORBIDDEN-EVAL
  category: scientific_boundary
