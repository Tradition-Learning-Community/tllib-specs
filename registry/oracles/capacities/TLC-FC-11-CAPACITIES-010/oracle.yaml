schema_version: 1
feature_id: TLC-FC-11-CAPACITIES-010
oracle_id: CAP-ORACLE-010
status: selected_for_capacities_implementation_specification
source_test_plan: registry/test-plans/TLC-FC-11-CAPACITIES-010/test-plan.yaml
algorithm: registry/algorithms/capacities/TLC-FC-11-CAPACITIES-010/algorithm.yaml
exact_result_available: false
oracle_basis: metric descriptor shape, symbol bindings, provenance and absence of measurement
acceptance_tests:
  - id: nominal_descriptor
    expect: {type: CapacityPrototypeDescriptor, object_order: [TLC-SO-CAPACITIES-021, TLC-SO-CAPACITIES-022, TLC-SO-CAPACITIES-034, TLC-SO-CAPACITIES-055], measurement_computed: false}
  - {id: missing_object, mutation: omit object, expect_error: MissingCoveredObject}
  - {id: duplicate_object, mutation: repeat object, expect_error: DuplicateCoveredObject}
  - {id: missing_provenance, mutation: omit source reference, expect_error: MissingSourceReference}
  - {id: metric_guard, request: compute efficiency variance or activation rate, expect_error: ScientificEvaluationRequested}
  - {id: condition_guard, request: decide presence of potential, expect_error: ScientificEvaluationRequested}
properties: {identity_conservation: true, scope_conservation: true, context_provenance_conservation: true, opaque_metric_conservation: true, deterministic_for_identical_inputs: true}
metamorphic_tests:
  - changing opaque metric text preserves structural identity
  - repeated construction yields equivalent descriptor projection
  - adding a metric value is forbidden and changes acceptance to failure
composition_tests: [registry exposes symbols without evaluator]
dependency_tests: [no measurement service or external observer invoked]
forbidden_observations: [score, efficiency value, variance, activation rate, potential truth, ranking]
pass_condition: all tests pass and no measurement value is produced
