schema_version: 1
domain: master
status: ready_for_developer_assignment
common_tasks:
  - task_id: TLC-MASTER-IMPL-COMMON-001
    title: Implement immutable Master common types and closed feature registry
    acceptance: all sixteen feature identifiers register in the declared deterministic order
  - task_id: TLC-MASTER-IMPL-COMMON-002
    title: Implement exact reference and unresolved validation
    acceptance: mismatched object, relation, or unresolved sets return the specified common errors
  - task_id: TLC-MASTER-IMPL-COMMON-003
    title: Implement opaque operation provider boundary
    acceptance: payloads cross the boundary unchanged and missing providers produce unresolved or provider-required results
  - task_id: TLC-MASTER-IMPL-COMMON-004
    title: Implement oracle-driven test harness
    acceptance: every feature oracle is executable without invented scientific values
