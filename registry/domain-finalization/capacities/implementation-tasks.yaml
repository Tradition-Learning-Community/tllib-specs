integration_tasks:
  - task_id: CAP-IMPL-INTEGRATION-001
    title: Register all 15 constructors in the Capacities module registry
    acceptance:
      - registry population equals authoritative 15-feature set
      - no legacy Goose identifier is registered
      - every artifact is queryable by canonical feature id
  - task_id: CAP-IMPL-INTEGRATION-002
    title: Execute oracle-driven conformance suite across supported backends
    acceptance:
      - all structural, error, provenance, opaque and unresolved tests pass
      - no backend introduces evaluation semantics
