schema_version: 1
domain_id: capacities
status: ready_for_future_implementation_assignment
global_tasks:
  - task_id: CAP-IMPL-CORE-001
    title: Implement shared immutable capacity artifact envelope
    scope: structural records and views only
    prerequisites: [module-specification, patterns]
    acceptance:
      - preserves canonical feature and object identities
      - preserves source order and provenance
      - exposes symbols, unresolved and reservations
      - contains no evaluator
  - task_id: CAP-IMPL-CORE-002
    title: Implement shared validation and error layer
    scope: feature, object, order, symbol, provenance and blocker validation
    prerequisites: [CAP-IMPL-CORE-001]
    acceptance:
      - emits common structured errors
      - validates exact population-specific inputs
      - rejects scientific evaluation requests
  - task_id: CAP-IMPL-CORE-003
    title: Implement structural registry and query views
    scope: lookup by feature id, object id and symbolic role
    prerequisites: [CAP-IMPL-CORE-001, CAP-IMPL-CORE-002]
    acceptance:
      - deterministic lookup
      - no endpoint or semantic inference
      - unresolved and opaque values remain unchanged
