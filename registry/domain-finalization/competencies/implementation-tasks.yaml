schema_version: 1
domain_id: competencies
status: ready_for_future_developer_assignment
constraints:
- implement structural descriptor layer only
- do not evaluate scientific equations or metrics
- do not add competency levels, scores, thresholds, progressions or comparisons
- preserve source contracts and source IRs
- use finalized IR, algorithm and oracle as the implementation packet
global_tasks:
- task_id: COMP-MOD-001
  title: Implement immutable Competencies value types
  inputs: [module-specification.yaml, patterns.yaml]
  deliverables: [FeatureId, ObjectId, SourceReference, CompetencyReference, CompetenciesFeatureProfile, CompetenciesCanonicalDescriptor]
  acceptance: types preserve identity, order, provenance, opaque payloads and reservations
- task_id: COMP-MOD-002
  title: Implement feature profile registry
  inputs: [feature-status.yaml, thirteen finalized IR files]
  deliverables: [compile_time_or_generated_profile_table]
  acceptance: exactly 13 profiles and no unknown or missing feature
- task_id: COMP-MOD-003
  title: Implement shared structural validation pipeline
  inputs: [patterns.yaml, thirteen algorithms]
  deliverables: [feature_identity_validation, exact_object_set_validation, provenance_validation]
  acceptance: all shared oracle error cases pass
- task_id: COMP-MOD-004
  title: Implement immutable descriptor builder
  inputs: [module-specification.yaml, thirteen algorithms]
  deliverables: [profile_driven_descriptor_construction]
  acceptance: catalogue order and opaque payload identity are preserved deterministically
- task_id: COMP-MOD-005
  title: Implement unsupported scientific operation guard
  inputs: [module-specification.yaml, decision-required.yaml]
  deliverables: [ScientificEvaluationRequested, BlockedScientificDecision]
  acceptance: score, threshold, simulation, rank, comparison and scientific resolution requests are rejected
- task_id: COMP-MOD-006
  title: Implement shared test harness
  inputs: [thirteen oracle files]
  deliverables: [fixture_factory_for_opaque_tokens, oracle_runner]
  acceptance: no fixture invents a competency or numerical scientific value
