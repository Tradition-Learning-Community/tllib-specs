classification_policy:
  blocking: prevents definition of observable behavior required by the current structural implementation package
  non_blocking: does not prevent the current package and remains explicitly represented
  deferred_to_scientific_review: requires scientific authority before executable dynamics may be added
  preserved_as_opaque: carried without evaluation or resolution
