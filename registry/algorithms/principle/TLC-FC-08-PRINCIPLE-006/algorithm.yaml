schema_version: 1
feature_id: TLC-FC-08-PRINCIPLE-006
signature: describe_principle_invariant_requirements(PrincipleInvariantRequirementEvidence) -> UnverifiablePrincipleInvariantDescriptor
inputs: [PrincipleInvariantRequirementEvidence]
outputs: [UnverifiablePrincipleInvariantDescriptor]
validations: [ids_non_empty, exact_two_objects, source_bindings_present]
preconditions: [description_only]
