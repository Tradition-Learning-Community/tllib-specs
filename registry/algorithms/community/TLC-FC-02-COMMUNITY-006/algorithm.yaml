pseudocode: |
  function describe_or_validate_community_006(request):
      require request.feature_id == "TLC-FC-02-COMMUNITY-006"
      require request.operation is supported
      sources = load_preserved_metadata_references()
      require sources.all_exist
      require sources.source_objects == ["TLC-SO-COMMUNITY-036"]
      require sources.unresolved == AUTHORITATIVE_COMMUNITY_UNRESOLVED
      blocker = "COMMUNITY-DECISION-001"
      require opaque_values_are_uninterpreted(request.opaque_values)
      if request.operation == "request_scientific_execution":
          return error(COMMUNITY_ERR_UNRESOLVED_SCIENTIFIC_SEMANTICS, request.feature_id, sources.unresolved, blocker)
      return structural_result(request.feature_id, sources, request.opaque_values, blocker=blocker, deterministic_serialization=true)
