pseudocode: |
  function describe_or_validate_community_008(request):
      require request.feature_id == "TLC-FC-02-COMMUNITY-008"
      require request.operation is supported
      sources = load_preserved_metadata_references()
      require sources.all_exist
      require sources.source_objects == ["TLC-SO-COMMUNITY-018", "TLC-SO-COMMUNITY-019", "TLC-SO-COMMUNITY-020"]
      require sources.unresolved == AUTHORITATIVE_COMMUNITY_UNRESOLVED
      require sources.dependencies == SYMBOL_ONLY_COMMUNITY_008_DEPENDENCIES
      require every dependency.executable == false
      require opaque_values_are_uninterpreted(request.opaque_values)
      if request.operation == "request_scientific_execution":
          return error(COMMUNITY_ERR_UNSUPPORTED_EXECUTION_REQUEST, request.feature_id, sources.unresolved)
      return structural_result(request.feature_id, sources, request.opaque_values, deterministic_serialization=true)
