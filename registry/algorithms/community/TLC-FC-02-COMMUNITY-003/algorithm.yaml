effects: none_on_scientific_state
errors: [COMMUNITY_ERR_FEATURE_ID_MISMATCH, COMMUNITY_ERR_SOURCE_ARTIFACT_MISSING, COMMUNITY_ERR_TRACEABILITY_INCOMPLETE, COMMUNITY_ERR_UNRESOLVED_NOT_PRESERVED, COMMUNITY_ERR_OPAQUE_VALUE_INTERPRETATION, COMMUNITY_ERR_UNSUPPORTED_EXECUTION_REQUEST]
postconditions:
