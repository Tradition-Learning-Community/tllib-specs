schema_version: '1.0'
algorithm_id: TLC-ALG-COMMUNITY-001
feature_id: TLC-FC-02-COMMUNITY-001
finalized_ir_ref: registry/optimized-ir/community/TLC-FC-02-COMMUNITY-001/ir.yaml
signature: "describe_or_validate_community_001(request: CommunitySpecificationRequest) -> CommunitySpecificationResult | CommunityError"
inputs:
- request with feature_id, operation and optional opaque values
outputs:
- deterministic structural result for describe or validate
- structured error for unsupported scientific execution
validations:
- feature_id is exactly TLC-FC-02-COMMUNITY-001
- contract, registry IR, candidate IR, supplemental IR and test plan references exist
- source object list equals [TLC-SO-COMMUNITY-008]
- unresolved set equals the authoritative 29-ID set
- opaque values are not interpreted
ordered_steps:
- validate request identity
- reject unknown operation
- load preserved references as metadata only
- validate source-object identity and order
- attach supplemental semantic graph as non-promoted evidence
- validate exact unresolved preservation
- validate opaque-value boundary
- when scientific execution is requested, emit unsupported-execution error
- otherwise build and return the traceable structural result
branching:
- condition: request.operation in [describe_feature_specification, validate_feature_specification]
  action: return_structural_result
- condition: request.operation == request_scientific_execution
  action: return_COMMUNITY_ERR_UNSUPPORTED_EXECUTION_REQUEST
transitions:
- received -> identity_validated
- identity_validated -> sources_validated
- sources_validated -> preservation_validated
- preservation_validated -> completed
- any_validation_failure -> rejected
effects: none_on_scientific_state
errors:
- COMMUNITY_ERR_FEATURE_ID_MISMATCH
- COMMUNITY_ERR_SOURCE_ARTIFACT_MISSING
- COMMUNITY_ERR_TRACEABILITY_INCOMPLETE
- COMMUNITY_ERR_UNRESOLVED_NOT_PRESERVED
- COMMUNITY_ERR_OPAQUE_VALUE_INTERPRETATION
- COMMUNITY_ERR_UNSUPPORTED_EXECUTION_REQUEST
postconditions:
- result is candidate-source traceable and structurally selected for the Community module
- no source or scientific payload is modified
- all unresolved identifiers and opaque values are returned unchanged
invariants:
- supplemental IR is never promoted or substituted for the source IR
- no measure, coherence, actor-domain or result semantics are inferred
determinism: deterministic_for_structural_operations
edge_cases:
- empty opaque-value collection is valid
- duplicate unresolved identifiers are rejected as non-exact preservation
- reordered source objects are rejected
- scientific execution always fails while source semantics remain unresolved
dependencies: []
unresolved_conserved:
  set_ref: registry/domain-finalization/community/manifest.yaml#unresolved_authoritative
  count: 29
pseudocode: |
  function describe_or_validate_community_001(request):
      require request.feature_id == "TLC-FC-02-COMMUNITY-001"
      require request.operation is supported
      sources = load_preserved_metadata_references()
      require sources.all_exist
      require sources.source_objects == ["TLC-SO-COMMUNITY-008"]
      require sources.unresolved == AUTHORITATIVE_COMMUNITY_UNRESOLVED
      require opaque_values_are_uninterpreted(request.opaque_values)
      if request.operation == "request_scientific_execution":
          return error(COMMUNITY_ERR_UNSUPPORTED_EXECUTION_REQUEST,
                       feature_id=request.feature_id,
                       unresolved=AUTHORITATIVE_COMMUNITY_UNRESOLVED)
      return structural_result(feature_id=request.feature_id,
                               source_artifacts=sources,
                               source_objects=sources.source_objects,
                               supplemental_evidence="ir-semantic.candidate.json",
                               unresolved=AUTHORITATIVE_COMMUNITY_UNRESOLVED,
                               opaque_values=request.opaque_values,
                               deterministic_serialization=true)
