schema_version: '1.0'
algorithm_id: TLC-ALG-TLC-FC-01-DISCIPLE-005
feature_id: TLC-FC-01-DISCIPLE-005
domain: disciple
optimized_ir_ref: registry/optimized-ir/disciple/TLC-FC-01-DISCIPLE-005/ir.yaml
signature: prepare_disciple_equations(request: DiscipleFeatureRequest, execute: bool = false) -> DeferredScientificOperation | DiscipleError
inputs:
  - request: feature identity and optional opaque scientific inputs
  - execute: explicit execution request
outputs:
  - deferred equation operation descriptor or structured error
validations:
  - feature_id equality
  - source operation presence
  - exact source reference preservation
preconditions:
  - no equation input schema, dimension, method, or evaluator is selected
ordered_steps:
  - validate request identity
  - load and copy source references
  - locate TLC-FC-01-DISCIPLE-005-OP-UNRESOLVED
  - preserve operation text and status
  - reject execution or emit deferred descriptor
branches:
  - condition: execute is true
    result: DISCIPLE_UNRESOLVED_OPERATION
  - condition: source operation missing
    result: DISCIPLE_MISSING_SOURCE_ARTIFACT
  - condition: otherwise
    result: deferred operation descriptor
state_transitions:
  - received -> validated -> deferred
  - received|validated -> rejected on error
errors:
  - DISCIPLE_INVALID_FEATURE_ID
  - DISCIPLE_MISSING_SOURCE_ARTIFACT
  - DISCIPLE_SOURCE_REFERENCE_MISMATCH
  - DISCIPLE_UNRESOLVED_OPERATION
postconditions:
  - no cited equation is evaluated, simplified, or approximated
  - source operation remains fully traceable
invariants:
  - no numerical method is selected
  - source identities remain distinct
determinism: descriptor generation and refusal branch are deterministic
effects: []
edge_cases:
  - opaque inputs may be empty
  - execute always fails while source execution status is unresolved_not_executable
unresolved_preserved:
  - source_operation:TLC-FC-01-DISCIPLE-005-OP-UNRESOLVED
dependencies:
  internal:
    - TLC-FC-01-DISCIPLE-009
  external: []
complexity:
  time: O(n)
  space: O(n)
pseudocode: |
  function prepare_disciple_equations(request, execute = false):
      require request.feature_id == "TLC-FC-01-DISCIPLE-005"
      source = load_preserved_source_ir()
      operation = require_source_operation("TLC-FC-01-DISCIPLE-005-OP-UNRESOLVED")
      refs = copy_exactly(source.data, source.relations)
      if execute:
          return error(DISCIPLE_UNRESOLVED_OPERATION, operation.id)
      return deferred_operation(feature_id=request.feature_id,
                                operation=copy_exactly(operation),
                                references=refs,
                                executable=false)
