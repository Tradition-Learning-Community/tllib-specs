schema_version: 1
algorithm_id: TLC-ALG-TLC-FC-15-RELATIONS-008
feature_id: TLC-FC-15-RELATIONS-008
status: selected_for_relations_implementation_specification
source_ir: registry/optimized-ir/relations/TLC-FC-15-RELATIONS-008/ir.yaml
signature: >-
  build_relations_008_record(feature_id, ordered_scientific_objects,
  decision_blocker, source_equations, evaluation_request=null)
  -> RelationsBlockedCanonicalRecord
inputs:
  - {name: feature_id, type: FeatureId}
  - {name: ordered_scientific_objects, type: List<OpaqueScientificObject>}
  - {name: decision_blocker, type: DecisionBlocker}
  - {name: source_equations, type: List<OpaqueSourceText>}
  - {name: evaluation_request, type: Optional<RelationsEvaluationRequest>}
outputs:
  - {name: record, type: RelationsBlockedCanonicalRecord}
expected_participants:
  - TLC-SO-RELATIONS-014
  - TLC-SO-RELATIONS-020
scope_id: relations_008_virtue_value_tuple_records
context_id: master_virtue_and_master_value_formalizations
validations:
  - exact feature identity
  - exact participant count, identities, distinctness and order
  - decision blocker equals scientific_decision_required
  - exactly two tuple equation strings in declared order
  - required source references exist
preconditions:
  - the caller requests structural construction only
  - opaque tuple text can be copied without interpretation
conditions_of_application:
  - no relation evaluator is supplied by this module
  - no fusion of the two tuple records is requested
  - no scientific operation is requested
ordered_steps:
  - {step: 1, action: compare feature_id with TLC-FC-15-RELATIONS-008}
  - {step: 2, action: validate the exact two distinct ordered participants}
  - {step: 3, action: validate both source references}
  - {step: 4, action: compare source_equations with the two contract-preserved tuple strings in order}
  - {step: 5, action: require scientific_decision_required}
  - {step: 6, action: reject fusion or a non-null evaluation_request}
  - {step: 7, action: construct the structural record by exact copying}
  - {step: 8, action: attach the non-execution guard}
  - {step: 9, action: validate postconditions and return}
branching:
  - {condition: feature_id mismatch, result: FeatureIdentityMismatch}
  - {condition: participant missing, result: MissingCoveredObject}
  - {condition: participant extra, result: UnexpectedCoveredObject}
  - {condition: participant duplicated, result: DuplicateCoveredObject}
  - {condition: participant order differs, result: ObjectOrderMismatch}
  - {condition: source reference missing, result: MissingSourceReference}
  - {condition: tuple count, text or order differs, result: OpaqueValueMutation}
  - {condition: decision blocker differs, result: UnresolvedPropagationLoss}
  - {condition: fusion of tuple records is requested, result: IdentityMergeProhibited}
  - {condition: evaluation_request is not null, result: ExternalRelationEvaluatorRequired}
construction_or_reading:
  construction: structural_record_only
  scientific_relation_created: false
  tuple_records_fused: false
  source_text_copied: true
identity_validation:
  feature: exact
  participants: exact_distinct_and_ordered
scope_context_validation:
  scope: exact scope_id
  context: exact context_id
creation: {declared: false}
membership: {declared: false}
composition: {declared: false}
inversion: {declared: false}
projection: {declared: false}
effects:
  mutation: none
  external_io: none
  scientific_result: none
errors:
  - FeatureIdentityMismatch
  - MissingCoveredObject
  - UnexpectedCoveredObject
  - DuplicateCoveredObject
  - ObjectOrderMismatch
  - MissingSourceReference
  - OpaqueValueMutation
  - UnresolvedPropagationLoss
  - IdentityMergeProhibited
  - ExternalRelationEvaluatorRequired
postconditions:
  - output identity, participants, scope and context equal the validated inputs
  - both tuple equations remain opaque, distinct and unchanged
  - all five unresolved reservations are present
  - no endpoint, direction, arity or relation result is returned
invariants:
  - participant identities and order are stable
  - two tuple records remain distinct
  - tuple component counts are not converted into relation arity
  - no endpoint, direction, property or causality is inferred
  - source references remain unchanged
determinism:
  structural_path: deterministic
  semantic_path: unavailable
edge_cases:
  - empty or single-participant input is rejected
  - duplicate participant is rejected
  - swapped valid participants are rejected
  - one or three tuple strings are rejected
  - tuple text normalization or reordering is rejected
  - fusion of tuple records is rejected
  - any evaluation request is rejected
dependencies:
  internal:
    - shared Relations structural validators
    - shared non-execution guard
  external_execution: []
  scientific_review:
    - TLC-HR-0074
unresolved_preserved:
  - scientific_decision_required
  - signature_not_specified
  - types_not_specified
  - oracle_not_identified
  - relation_semantics_unresolved
pseudocode: |
  EXPECTED_IDS := [TLC-SO-RELATIONS-014, TLC-SO-RELATIONS-020]
  EXPECTED_TUPLE_TEXTS := two contract-preserved opaque equations in order
  require feature_id == TLC-FC-15-RELATIONS-008
  validate_exact_distinct_ordered_participants(ordered_scientific_objects, EXPECTED_IDS)
  validate_source_references(ordered_scientific_objects)
  require source_equations == EXPECTED_TUPLE_TEXTS
  require decision_blocker == scientific_decision_required
  if request_requires_fusion(evaluation_request):
      raise IdentityMergeProhibited
  if evaluation_request is not null:
      raise ExternalRelationEvaluatorRequired
  record := RelationsBlockedCanonicalRecord(
      feature_id = feature_id,
      participants = copy_without_interpretation(ordered_scientific_objects),
      scope_id = relations_008_virtue_value_tuple_records,
      context_id = master_virtue_and_master_value_formalizations,
      unevaluated_source_equations = copy_exact(source_equations),
      unresolved = copy_exact(contract_unresolved),
      non_execution_guard = enabled)
  validate_record_postconditions(record)
  return record
