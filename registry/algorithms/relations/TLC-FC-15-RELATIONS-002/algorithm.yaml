schema_version: 1
algorithm_id: TLC-ALG-TLC-FC-15-RELATIONS-002
feature_id: TLC-FC-15-RELATIONS-002
status: selected_for_relations_implementation_specification
source_ir: registry/optimized-ir/relations/TLC-FC-15-RELATIONS-002/ir.yaml
signature: >-
  build_relations_002_record(feature_id, ordered_scientific_objects,
  decision_blocker, source_equations, evaluation_request=null)
  -> RelationsBlockedCanonicalRecord
inputs:
  - name: feature_id
    type: FeatureId
  - name: ordered_scientific_objects
    type: List<OpaqueScientificObject>
  - name: decision_blocker
    type: DecisionBlocker
  - name: source_equations
    type: List<OpaqueSourceText>
  - name: evaluation_request
    type: Optional<RelationsEvaluationRequest>
outputs:
  - name: record
    type: RelationsBlockedCanonicalRecord
expected_participants:
  - TLC-SO-RELATIONS-047
  - TLC-SO-RELATIONS-048
  - TLC-SO-RELATIONS-064
  - TLC-SO-RELATIONS-077
  - TLC-SO-RELATIONS-088
  - TLC-SO-RELATIONS-100
scope_id: relations_002_source_equation_bundle
context_id: master_message_virtue_value_capacity_competence_formalizations
validations:
  - exact feature identity
  - exact participant count, identities and order
  - no duplicate or extra participant
  - decision blocker equals scientific_decision_required
  - five source equations match the preserved source text in order
  - required source references exist
preconditions:
  - the caller requests structural construction only
  - opaque payloads can be copied without interpretation
  - unresolved metadata is available
conditions_of_application:
  - no relation evaluator is supplied by this module
  - no numeric, graph, temporal, membership, composition, inversion, projection, deduction or causal operation is requested
ordered_steps:
  - step: 1
    action: compare feature_id with TLC-FC-15-RELATIONS-002
  - step: 2
    action: compare participant identifiers and order with expected_participants
  - step: 3
    action: validate source references for every participant
  - step: 4
    action: compare source_equations with the five contract-preserved opaque strings
  - step: 5
    action: require decision_blocker scientific_decision_required
  - step: 6
    action: reject evaluation_request when it is not null
  - step: 7
    action: construct a record by copying validated structural fields, opaque equations and unresolved metadata
  - step: 8
    action: attach the non-execution guard
  - step: 9
    action: validate postconditions and return the record
branching:
  - condition: feature_id mismatch
    result: FeatureIdentityMismatch
  - condition: participant missing
    result: MissingCoveredObject
  - condition: participant extra
    result: UnexpectedCoveredObject
  - condition: participant duplicated
    result: DuplicateCoveredObject
  - condition: participant order differs
    result: ObjectOrderMismatch
  - condition: source reference missing
    result: MissingSourceReference
  - condition: equation text or order differs
    result: OpaqueValueMutation
  - condition: decision blocker differs
    result: UnresolvedPropagationLoss
  - condition: evaluation_request is not null
    result: ExternalRelationEvaluatorRequired
construction_or_reading:
  construction: structural_record_only
  relation_created: false
  source_relation_read: false
  source_text_copied: true
identity_validation:
  feature: exact
  participants: exact_and_ordered
scope_context_validation:
  scope: exact scope_id
  context: exact context_id
creation:
  declared: false
membership:
  declared: false
composition:
  declared: false
inversion:
  declared: false
projection:
  declared: false
effects:
  mutation: none
  external_io: none
  scientific_result: none
errors:
  - FeatureIdentityMismatch
  - MissingCoveredObject
  - UnexpectedCoveredObject
  - DuplicateCoveredObject
  - ObjectOrderMismatch
  - MissingSourceReference
  - OpaqueValueMutation
  - UnresolvedPropagationLoss
  - ExternalRelationEvaluatorRequired
postconditions:
  - output identity, participants, scope and context equal the validated inputs
  - equations remain opaque and unchanged
  - all five unresolved reservations are present
  - the record cannot be evaluated by this module
invariants:
  - participant order is stable
  - no endpoint, direction, arity, property or causality is inferred
  - source contract and source IR references remain unchanged
determinism:
  structural_path: deterministic
  semantic_path: unavailable
edge_cases:
  - empty participant list is rejected
  - correct participants in a different order are rejected
  - duplicate expected participant is rejected
  - equation text differing only by normalization is rejected unless the implementation preserves the exact canonical value
  - null opaque payload is allowed when identity and source reference remain valid
  - any evaluation request is rejected
dependencies:
  internal:
    - shared Relations structural validators
    - shared non-execution guard
  external_execution: []
  scientific_review:
    - TLC-HR-0054
unresolved_preserved:
  - scientific_decision_required
  - signature_not_specified
  - types_not_specified
  - oracle_not_identified
  - relation_semantics_unresolved
pseudocode: |
  EXPECTED_IDS := [047, 048, 064, 077, 088, 100 as full TLC object ids]
  EXPECTED_EQUATIONS := contract-preserved opaque equation strings
  require feature_id == TLC-FC-15-RELATIONS-002
  validate_exact_ordered_participants(ordered_scientific_objects, EXPECTED_IDS)
  validate_source_references(ordered_scientific_objects)
  require source_equations == EXPECTED_EQUATIONS
  require decision_blocker == scientific_decision_required
  if evaluation_request is not null:
      raise ExternalRelationEvaluatorRequired
  record := RelationsBlockedCanonicalRecord(
      feature_id = feature_id,
      participants = copy_without_interpretation(ordered_scientific_objects),
      scope_id = relations_002_source_equation_bundle,
      context_id = master_message_virtue_value_capacity_competence_formalizations,
      unevaluated_source_equations = copy_exact(source_equations),
      unresolved = copy_exact(contract_unresolved),
      non_execution_guard = enabled)
  validate_record_postconditions(record)
  return record
