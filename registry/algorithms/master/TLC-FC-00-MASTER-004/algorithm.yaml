schema_version: 1
algorithm_id: TLC-ALG-TLC-FC-00-MASTER-004
feature_id: TLC-FC-00-MASTER-004
status: selected_for_master_implementation_specification
finalized_ir_ref: registry/optimized-ir/master/TLC-FC-00-MASTER-004/ir.yaml
signature: evaluate_reserved_master_constraints(reference_bundle, opaque_inputs, provider, disciple_symbol) -> MasterOpaqueEvaluationResult
inputs: {reference_bundle: ScientificReferenceBundle, opaque_inputs: OpaqueScientificPayload, provider: OpaqueOperationProvider, disciple_symbol: read-only external symbol}
outputs: {result: MasterOpaqueEvaluationResult}
validations:
  - require exact feature, eight object refs, ten relation refs, and fifteen unresolved refs
  - require disciple_symbol and provider only in evaluated mode
steps:
  - validate exact identity and all ordered source sets
  - construct immutable provenance
  - return unresolved directly when evaluation is not requested
  - validate read-only Disciple dependency and provider
  - invoke provider with unchanged bundle and opaque inputs
  - preserve provider payload and unresolved identifiers unchanged
  - verify no scientific merge, equivalence, or interpretation occurred
  - return result
branches:
  - {condition: no evaluation request, action: return unresolved result with all fifteen identifiers}
  - {condition: missing disciple symbol, action: return MASTER_EXTERNAL_DEPENDENCY_UNAVAILABLE}
  - {condition: missing provider, action: return MASTER_OPAQUE_PROVIDER_REQUIRED}
  - {condition: provider failure, action: return MASTER_OPAQUE_PROVIDER_FAILURE}
errors: [MASTER_INVALID_FEATURE_ID, MASTER_REFERENCE_SET_MISMATCH, MASTER_UNRESOLVED_SET_MISMATCH, MASTER_EXTERNAL_DEPENDENCY_UNAVAILABLE, MASTER_OPAQUE_PROVIDER_REQUIRED, MASTER_OPAQUE_PROVIDER_FAILURE, MASTER_PRESERVATION_VIOLATION]
invariants: [exact ordered source sets, opaque payload unchanged, unresolved relation remains unresolved]
determinism: wrapper deterministic; provider determinism is provider-declared
effects: none
edge_cases: [empty payload allowed, partial unresolved list rejected, provider unresolved result propagated]
necessary_dependencies: [{domain: disciple, access: read_only, required_for: evaluated_mode}]
