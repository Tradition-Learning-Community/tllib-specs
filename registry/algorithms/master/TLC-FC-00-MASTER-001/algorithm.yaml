schema_version: 1
algorithm_id: TLC-ALG-TLC-FC-00-MASTER-001
feature_id: TLC-FC-00-MASTER-001
status: selected_for_master_implementation_specification
finalized_ir_ref: registry/optimized-ir/master/TLC-FC-00-MASTER-001/ir.yaml
signature: describe_empirical_threshold_configuration(reference_bundle) -> MasterDescriptor
inputs:
  reference_bundle: ScientificReferenceBundle containing exactly TLC-SO-MASTER-040 and TLC-SR-MASTER-037
outputs:
  result: immutable MasterDescriptor
validations:
  - require feature_id TLC-FC-00-MASTER-001
  - require exact object and relation lists
  - require empty unresolved list
steps:
  - validate the reference bundle without interpreting scientific content
  - construct provenance links to contract, source IR, test plan, and maths source
  - copy the object and relation references into an immutable descriptor
  - mark empirical values and calibration context opaque
  - verify that no equation, value, type, dimension, alias, or calibration method was added
  - return the descriptor
branches:
  - condition: any validation fails
    action: return the corresponding Master common error
  - condition: calculation is requested
    action: return MASTER_UNSUPPORTED_EXECUTION_MODE
errors: [MASTER_INVALID_FEATURE_ID, MASTER_REFERENCE_SET_MISMATCH, MASTER_PRESERVATION_VIOLATION, MASTER_UNSUPPORTED_EXECUTION_MODE]
invariants: [exact source references, empty unresolved list, immutable provenance]
determinism: deterministic for identical structured input
effects: none
edge_cases:
  - missing or additional references are rejected
  - absent empirical values do not block descriptor emission
necessary_dependencies: []
