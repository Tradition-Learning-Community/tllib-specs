schema_version: 1
feature_id: TLC-FC-10-VIRTUES-011
status: selected_for_virtues_implementation_specification
ir_ref: registry/optimized-ir/virtues/TLC-FC-10-VIRTUES-011/ir.yaml
source_contract_ref: registry/math-contracts/TLC-FC-10-VIRTUES-011/contract.yaml
entrypoint: package_vice_diagnostic_function
signature: "package_vice_diagnostic_function(request: VirtuesRequest) -> VirtuesResult"
inputs: [feature_id, artifact, provenance, reservations]
outputs: [accepted observation-relation package or named error]
validations:
  - exact feature id
  - provenance contains TLC-SO-VIRTUES-055 and TLC-SO-VIRTUES-212
  - no inferred diagnosis, correction prescription, score, ranking, or moral decision requested
preconditions: [request uses VirtuesRequest]
conditions_of_application: [vice evidence and development-domain labels are supplied by humans]
ordered_steps:
  - validate feature id
  - validate provenance
  - reject diagnosis inference, correction prescription, and unsupported completion
  - copy supplied vice evidence
  - copy supplied development-domain labels and pairings
  - build accepted source-bound result
branching:
  invalid_feature: invalid_feature_id
  incomplete_provenance: missing_provenance
  diagnosis_or_correction_requested: unsupported_scientific_completion_request
construction_or_reading: package supplied observations and supplied relation labels
identity_scope_context_validation:
  identity: exact feature, source objects, and supplied endpoint tokens
  scope: diagnostic observation packaging only
  context: opaque
relation_processing: [preserve supplied vice-evidence to development-domain-label pairing]
observation: record supplied observations without inference
comparison: none
effects: result construction only
errors: [missing_provenance, unsupported_scientific_completion_request, invalid_feature_id]
postconditions:
  - evidence, labels, pairings, provenance, and reservations are preserved
  - no diagnosis, correction, score, or normative conclusion is produced
invariants: [pairing preserved, endpoints opaque, source order unchanged]
determinism: deterministic for identical requests
edge_cases:
  - empty supplied mapping is preserved
  - unknown labels remain opaque
  - repeated evidence-label pairs remain repeated
  - correction requests are rejected
dependencies: [common Virtues validation, observation package builder, relation preservation, result envelope]
unresolved_conserved: []
pseudocode: |
  function package_vice_diagnostic_function(request):
      if request.feature_id != "TLC-FC-10-VIRTUES-011":
          return error("invalid_feature_id")
      required = ["TLC-SO-VIRTUES-055", "TLC-SO-VIRTUES-212"]
      if not provenance_contains(request.provenance, required):
          return error("missing_provenance")
      if requests_diagnosis_or_correction(request) or requests_unsupported_completion(request):
          return error("unsupported_scientific_completion_request")
      package = copy_opaque(request.artifact)
      return accepted_result(
          feature_id=request.feature_id,
          entrypoint="package_vice_diagnostic_function",
          source_objects=required,
          artifact=package,
          reservations=copy_opaque(request.reservations),
          unresolved=[],
          assumptions=["source fragments are metadata, not executable science"])
