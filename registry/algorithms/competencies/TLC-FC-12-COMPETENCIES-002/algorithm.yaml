pseudocode: |-
  function build_constraint_descriptor_002(feature_id, object_payloads, provenance, request_mode):
      if request_mode != structural_descriptor_only: return error ScientificEvaluationRequested
      if feature_id != TLC-FC-12-COMPETENCIES-002: return error UnknownFeatureId
      required = [TLC-SO-COMPETENCIES-031]
      validate_exact_object_set(object_payloads, required)
      validate_provenance(provenance, required)
      descriptor = construct_immutable_descriptor(
          profile(TLC-FC-12-COMPETENCIES-002),
          copy_opaque_identities(object_payloads, required),
          copy(provenance for required),
          copy(source_reservations),
          copy(source_unresolved))
      descriptor.structural_status = structurally_valid
      return descriptor
