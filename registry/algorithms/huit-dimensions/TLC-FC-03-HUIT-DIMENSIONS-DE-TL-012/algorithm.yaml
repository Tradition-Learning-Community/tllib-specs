      result.set_subject(copy_opaque(latency_claim.subject))
      result.set_measure(copy_opaque(latency_claim.measure_token))
      result.set_relation(copy_opaque(latency_claim.nonzero_relation))
      result.set_statuses(evaluation=unresolved, boundary=unresolved, identity=unresolved)
      verify_identity_opacity_and_propagation(result)
      return result
