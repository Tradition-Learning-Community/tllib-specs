schema_version: 1
feature_id: TLC-FC-11-CAPACITIES-002
algorithm_id: CAP-ALG-002
status: selected_for_capacities_implementation_specification
source_ir: registry/optimized-ir/capacities/TLC-FC-11-CAPACITIES-002/ir.yaml
signature: 'CapacityConstraintAst construct_mastery_constraint_ast_with_axiom_guard(FeatureId, List<OpaqueScientificObject>, Map<ObjectId,List<UnevaluatedSymbol>>, Map<ObjectId,SourceReference>, DecisionBlocker)'
inputs:
  required_object_order: [TLC-SO-CAPACITIES-043, TLC-SO-CAPACITIES-090]
outputs: [CapacityConstraintAst]
validations:
  - exact feature id, object membership and order
  - symbol entry and provenance for every object
  - exact decision blocker
  - structural request only
preconditions: [all targeted inputs present]
conditions_of_application: [scientific execution remains unresolved]
steps:
  - validate targeted envelope
  - create opaque axiom node for object 043
  - create opaque constraint node for object 090
  - create root preserving both nodes in source order
  - attach symbols, provenance and decision blocker
  - attach non-evaluation guard
  - expose structural queries
  - return immutable AST
branching:
  invalid_membership: MissingCoveredObject or UnexpectedCoveredObject
  invalid_order: ObjectOrderMismatch
  missing_symbol: MissingSymbolTableEntry
  missing_blocker: MissingDecisionBlocker
  evaluation_requested: ScientificEvaluationRequested
capacity_handling: {construction: AST only, identity_validation: exact, scope_validation: exact, context_validation: provenance}
relations: none
activation: not_performed
mobilization: not_performed
development: represented_by_opaque_constraint_node_only
comparison: identifier_and_shape_only
effects: no scientific mutation
errors: [UnknownFeatureId, MissingCoveredObject, UnexpectedCoveredObject, ObjectOrderMismatch, MissingSymbolTableEntry, MissingSourceReference, MissingDecisionBlocker, ScientificEvaluationRequested]
postconditions:
  - guarded root has axiom then constraint node
  - blocker and provenance remain unchanged
invariants: [opaque payloads uninspected, no mastery result]
determinism: deterministic
case_limits:
  - reversed object order fails
  - empty symbol list is allowed only when explicitly present
  - solving or optimizing fails
unresolved_conserved: [scientific decision required]
dependencies: []
pseudocode: |
  require feature_id == TLC-FC-11-CAPACITIES-002 else UnknownFeatureId
  require exact_order(objects, [043, 090]) else membership_or_order_error
  require symbol_entry_for_each_object(symbol_table) else MissingSymbolTableEntry
  require complete_provenance(provenance) else MissingSourceReference
  require blocker == "scientific decision required" else MissingDecisionBlocker
  require request_is_structural_only() else ScientificEvaluationRequested
  root = constraint_ast(opaque_node(043), opaque_node(090))
  root.attach(symbol_table, provenance, blocker, non_evaluation_guard)
  return immutable(root)
