schema_version: 1
feature_id: TLC-FC-11-CAPACITIES-006
algorithm_id: CAP-ALG-006
status: selected_for_capacities_implementation_specification
source_ir: registry/optimized-ir/capacities/TLC-FC-11-CAPACITIES-006/ir.yaml
signature: 'CapacityDynamicsAstBundle construct_context_and_motivation_dynamics_ast(FeatureId, List<OpaqueScientificObject>, Map<ObjectId,List<UnevaluatedSymbol>>, Map<ObjectId,SourceReference>, DecisionBlocker)'
inputs: {required_object_order: [TLC-SO-CAPACITIES-089, TLC-SO-CAPACITIES-092]}
outputs: [CapacityDynamicsAstBundle]
validations: [exact feature id, exact membership and order, complete symbol entries, complete provenance, exact blocker, structural request]
preconditions: [all targeted inputs present]
conditions_of_application: [no dynamics execution]
steps:
  - validate targeted envelope
  - create independent opaque nodes for context adaptation and motivation
  - link nodes in an ordered non-evaluated bundle
  - attach symbols, provenance, blocker and guard
  - return immutable bundle
branching:
  invalid_membership: MissingCoveredObject or UnexpectedCoveredObject
  invalid_order: ObjectOrderMismatch
  missing_symbol: MissingSymbolTableEntry
  missing_blocker: MissingDecisionBlocker
  evaluation_requested: ScientificEvaluationRequested
capacity_handling: {construction: bundle only, identity_validation: exact, scope_validation: exact, context_validation: independent source sections}
relations: none
activation: not_performed
mobilization: not_performed
development: represented_by_two_opaque_equations_only
comparison: identifier_and_shape_only
effects: no state update or derivative calculation
errors: [UnknownFeatureId, MissingCoveredObject, UnexpectedCoveredObject, ObjectOrderMismatch, MissingSymbolTableEntry, MissingSourceReference, MissingDecisionBlocker, ScientificEvaluationRequested]
postconditions: [two-node order preserved, independent provenance preserved, blocker unchanged]
invariants: [opaque expressions unexecuted, no inferred causal link between nodes]
determinism: deterministic
case_limits: [reversal fails, missing explicit symbol entry fails, context or motivation evaluation fails]
unresolved_conserved: [scientific decision required]
dependencies: []
pseudocode: |
  require feature_id == TLC-FC-11-CAPACITIES-006 else UnknownFeatureId
  require exact_order(objects, [089, 092]) else membership_or_order_error
  require symbol_entry_for_each_object(symbol_table) else MissingSymbolTableEntry
  require complete_provenance(provenance) else MissingSourceReference
  require blocker == "scientific decision required" else MissingDecisionBlocker
  require request_is_structural_only() else ScientificEvaluationRequested
  bundle = immutable_dynamics_bundle(opaque_node(089), opaque_node(092))
  bundle.attach(symbol_table, provenance, blocker, non_evaluation_guard)
  return bundle
