errors: [UnknownFeatureId, MissingCoveredObject, UnexpectedCoveredObject, ObjectOrderMismatch, MissingSymbolTableEntry, MissingSourceReference, MissingDecisionBlocker, ScientificEvaluationRequested]
postconditions: [only source-present roles indexed, symbols and provenance unchanged]
invariants: [no role or symbol invented, no curvature or geodesic calculation]
determinism: deterministic
