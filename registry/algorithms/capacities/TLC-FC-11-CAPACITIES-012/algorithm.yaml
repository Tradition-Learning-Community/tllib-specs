dependencies: []
pseudocode: |
  require feature_id == TLC-FC-11-CAPACITIES-012 else UnknownFeatureId
  require exact_order(objects, [042]) else membership_or_order_error
  require symbol_entry(symbol_table, 042) else MissingSymbolTableEntry
  require complete_provenance(provenance) else MissingSourceReference
  require blocker == "scientific decision required" else MissingDecisionBlocker
  require request_is_structural_only() else ScientificEvaluationRequested
  index = empty_metric_structure_index()
  for token in symbol_table[042]: index.add(source_role(token), token, provenance[042])
  index.attach(blocker, non_evaluation_guard)
  return immutable(index)
