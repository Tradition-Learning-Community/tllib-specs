steps:
  - validate targeted envelope
  - inspect only the supplied symbol-token list, not scientific semantics
  - create index entries for source-present roles
  - associate each entry with unchanged symbol and provenance
  - attach blocker and non-evaluation guard
  - return immutable index
branching: {invalid_membership: MissingCoveredObject or UnexpectedCoveredObject, missing_symbol: MissingSymbolTableEntry, missing_blocker: MissingDecisionBlocker, geometry_requested: ScientificEvaluationRequested}
capacity_handling: {construction: component index only, identity_validation: exact, scope_validation: singleton, context_validation: provenance}
relations: none
