schema_version: 1
test_plan_id: TLC-TP-TLC-FC-04-INVARIANTS-006-PROTOTYPE-001
feature_id: TLC-FC-04-INVARIANTS-006
contract_id: TLC-LEC-TLC-FC-04-INVARIANTS-006-001
ir_id: TLC-IR-TLC-FC-04-INVARIANTS-006-PROTOTYPE-001
scope: prototype_ir_structural_validation_only
tests:
- id: TEST-006-NOMINAL
  category: operation_nominal
  invokes: describe_collective_ethics_oracle
  scenario: Produce an uncallable descriptor from the two covered oracle evidence records.
  expected_structural_effect: Returns a descriptor marked uncallable with its lemma and manifestation evidence IDs.
- id: TEST-006-OPAQUE
  category: opaque_boundary
  invokes: describe_collective_ethics_oracle
  scenario: 'Supply valid evidence whose opaque portion is not interpretable: Arguments, return type, evaluation rule, failure
    semantics, and determinism are scientifically unspecified.'
  expected_structural_effect: Opaque content is preserved byte-for-byte and is not evaluated.
- id: TEST-006-PRECONDITION
  category: precondition_failure
  invokes: describe_collective_ethics_oracle
  scenario: 'Violate the operation-specific precondition: Both covered evidence IDs and source references are present.'
  expected_error: MissingOracleEvidence
- id: TEST-006-POSTCONDITION
  category: observable_postcondition
  invokes: describe_collective_ethics_oracle
  scenario: Execute with valid covered evidence.
  expected_structural_effect: Returns a descriptor marked uncallable with its lemma and manifestation evidence IDs.
- id: TEST-006-RESERVATIONS
  category: reservation_propagation
  invokes: describe_collective_ethics_oracle
  scenario: Execute with all feature unresolved IDs and provisional assumptions attached.
  expected_structural_effect: The output retains the exact unresolved and assumption ID sets and makes no resolution claim.
- id: TEST-006-CONFORMANCE
  category: contract_ir_conformance
  invokes: describe_collective_ethics_oracle
  scenario: Compare callable, input type, output type, errors, postconditions, and readiness across contract and IR.
  expected_structural_effect: All specialized interface fields and readiness values agree.
numeric_expected_results: []
implementation_status: planned_for_descriptor_only_scientific_operation_blocked
operation_under_test: describe_collective_ethics_oracle
