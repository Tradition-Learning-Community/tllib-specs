schema_version: 1
test_plan_id: TLC-TP-TLC-FC-04-INVARIANTS-008-PROTOTYPE-001
feature_id: TLC-FC-04-INVARIANTS-008
contract_id: TLC-LEC-TLC-FC-04-INVARIANTS-008-001
ir_id: TLC-IR-TLC-FC-04-INVARIANTS-008-PROTOTYPE-001
scope: prototype_ir_structural_validation_only
tests:
- id: TEST-008-NOMINAL
  category: operation_nominal
  invokes: assemble_invariant_state_vocabulary
  scenario: Assemble all twelve covered concept terms and attach the eleven mapped unresolved identifiers.
  expected_structural_effect: Returns a vocabulary keyed by state-term IDs with unresolved IDs attached to the affected terms.
- id: TEST-008-OPAQUE
  category: opaque_boundary
  invokes: assemble_invariant_state_vocabulary
  scenario: 'Supply valid evidence whose opaque portion is not interpretable: No transition graph, chronology, state detector,
    or scientific state equivalence is inferred.'
  expected_structural_effect: Opaque content is preserved byte-for-byte and is not evaluated.
- id: TEST-008-PRECONDITION
  category: precondition_failure
  invokes: assemble_invariant_state_vocabulary
  scenario: 'Violate the operation-specific precondition: Every state term and unresolved identifier is covered by the preparation
    mapping.'
  expected_error: UnknownStateTermId or UnresolvedMappingLoss
- id: TEST-008-POSTCONDITION
  category: observable_postcondition
  invokes: assemble_invariant_state_vocabulary
  scenario: Execute with valid covered evidence.
  expected_structural_effect: Returns a vocabulary keyed by state-term IDs with unresolved IDs attached to the affected terms.
- id: TEST-008-RESERVATIONS
  category: reservation_propagation
  invokes: assemble_invariant_state_vocabulary
  scenario: Execute with all feature unresolved IDs and provisional assumptions attached.
  expected_structural_effect: The output retains the exact unresolved and assumption ID sets and makes no resolution claim.
- id: TEST-008-CONFORMANCE
  category: contract_ir_conformance
  invokes: assemble_invariant_state_vocabulary
  scenario: Compare callable, input type, output type, errors, postconditions, and readiness across contract and IR.
  expected_structural_effect: All specialized interface fields and readiness values agree.
numeric_expected_results: []
implementation_status: ready_for_operation_specific_test_implementation
operation_under_test: assemble_invariant_state_vocabulary
