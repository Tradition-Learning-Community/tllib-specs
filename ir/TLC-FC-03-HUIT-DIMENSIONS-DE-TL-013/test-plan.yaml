schema_version: 1
test_plan_id: TLC-TP-TLC-FC-03-HUIT-DIMENSIONS-DE-TL-013-PROTOTYPE-001
feature_id: TLC-FC-03-HUIT-DIMENSIONS-DE-TL-013
contract_id: TLC-LEC-TLC-FC-03-HUIT-DIMENSIONS-DE-TL-013-001
ir_id: TLC-IR-TLC-FC-03-HUIT-DIMENSIONS-DE-TL-013-PROTOTYPE-001
scope: prototype_ir_structural_validation_only
tests:
- id: TEST-013-TYPE
  category: type_validation
  assertion: Opaque and parameterized boundary types are accepted without scientific interpretation.
- id: TEST-013-SHAPE
  category: shape_validation
  assertion: Required feature, object, relation, reservation, and assumption identifier collections are present.
- id: TEST-013-PRE
  category: preconditions
  assertion: Missing or unknown identifiers are rejected.
- id: TEST-013-ERROR
  category: errors
  assertion: Scientific promotion, identity determination, or introduction of unspecified semantics is rejected.
- id: TEST-013-INVARIANT
  category: invariants
  assertion: Contract invariants and candidate scientific object identities remain distinct and unchanged.
- id: TEST-013-DETERMINISM
  category: determinism
  assertion: Identical opaque records produce structurally identical unevaluated results.
- id: TEST-013-OPAQUE
  category: opaque_propagation
  assertion: Opaque values pass through without coercion, evaluation, ordering, or aggregation.
- id: TEST-013-STABLE
  category: identifier_stability
  assertion: Feature, object, relation, reservation, and assumption identifiers remain byte-for-byte stable.
- id: TEST-013-TRACE
  category: traceability
  assertion: Contract, source, object, relation, reservation, and assumption references are preserved.
- id: TEST-013-RESERVE
  category: non_resolution
  assertion: No reservation is marked resolved and unresolved feature identity or boundary status is unchanged.
- id: TEST-013-CONFORM
  category: contract_ir_conformance
  assertion: IR inputs, outputs, failures, reservations, assumptions, and readiness agree with the contract.
- id: TEST-013-INTEGRATION
  category: minimal_integration
  assertion: A contract record can be bound to its IR and test plan solely by stable identifiers.
numeric_expected_results: []
implementation_status: planned_not_implemented
