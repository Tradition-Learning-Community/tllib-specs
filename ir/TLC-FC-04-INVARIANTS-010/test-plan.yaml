schema_version: 1
test_plan_id: TLC-TP-TLC-FC-04-INVARIANTS-010-PROTOTYPE-001
feature_id: TLC-FC-04-INVARIANTS-010
contract_id: TLC-LEC-TLC-FC-04-INVARIANTS-010-001
ir_id: TLC-IR-TLC-FC-04-INVARIANTS-010-PROTOTYPE-001
scope: prototype_ir_structural_validation_only
tests:
- id: TEST-010-NOMINAL
  category: operation_nominal
  invokes: index_state_interpretation_fragments
  scenario: Index the three interpretation fragments while preserving their non-operational status.
  expected_structural_effect: Returns an index containing exactly the three source IDs, each marked non-operational and rejected.
- id: TEST-010-OPAQUE
  category: opaque_boundary
  invokes: index_state_interpretation_fragments
  scenario: 'Supply valid evidence whose opaque portion is not interpretable: The fragments do not define states, transitions,
    ordering, or state equality.'
  expected_structural_effect: Opaque content is preserved byte-for-byte and is not evaluated.
- id: TEST-010-PRECONDITION
  category: precondition_failure
  invokes: index_state_interpretation_fragments
  scenario: 'Violate the operation-specific precondition: Each fragment ID and its refers_to relation is covered and carries
    rejected-as-feature status.'
  expected_error: DuplicateStateFragmentId or OperationalStatePromotion
- id: TEST-010-POSTCONDITION
  category: observable_postcondition
  invokes: index_state_interpretation_fragments
  scenario: Execute with valid covered evidence.
  expected_structural_effect: Returns an index containing exactly the three source IDs, each marked non-operational and rejected.
- id: TEST-010-RESERVATIONS
  category: reservation_propagation
  invokes: index_state_interpretation_fragments
  scenario: Execute with all feature unresolved IDs and provisional assumptions attached.
  expected_structural_effect: The output retains the exact unresolved and assumption ID sets and makes no resolution claim.
- id: TEST-010-CONFORMANCE
  category: contract_ir_conformance
  invokes: index_state_interpretation_fragments
  scenario: Compare callable, input type, output type, errors, postconditions, and readiness across contract and IR.
  expected_structural_effect: All specialized interface fields and readiness values agree.
numeric_expected_results: []
implementation_status: ready_for_operation_specific_test_implementation
operation_under_test: index_state_interpretation_fragments
