schema_version: 1
test_plan_id: TLC-TP-TLC-FC-04-INVARIANTS-005-PROTOTYPE-001
feature_id: TLC-FC-04-INVARIANTS-005
contract_id: TLC-LEC-TLC-FC-04-INVARIANTS-005-001
ir_id: TLC-IR-TLC-FC-04-INVARIANTS-005-PROTOTYPE-001
scope: prototype_ir_structural_validation_only
tests:
- id: TEST-005-NOMINAL
  category: operation_nominal
  invokes: attach_interpretation_annotations
  scenario: Attach the three covered interpretation annotations to the root evidence.
  expected_structural_effect: Returns root evidence with three ordered annotations; annotations cannot change invariant truth
    or status.
- id: TEST-005-OPAQUE
  category: opaque_boundary
  invokes: attach_interpretation_annotations
  scenario: 'Supply valid evidence whose opaque portion is not interpretable: Interpretation contents remain opaque and non-normative.'
  expected_structural_effect: Opaque content is preserved byte-for-byte and is not evaluated.
- id: TEST-005-PRECONDITION
  category: precondition_failure
  invokes: attach_interpretation_annotations
  scenario: 'Violate the operation-specific precondition: Every annotation ID and refers_to relation is covered and targets
    the invariant root.'
  expected_error: UnknownAnnotationId or AnnotationTargetMismatch
- id: TEST-005-POSTCONDITION
  category: observable_postcondition
  invokes: attach_interpretation_annotations
  scenario: Execute with valid covered evidence.
  expected_structural_effect: Returns root evidence with three ordered annotations; annotations cannot change invariant truth
    or status.
- id: TEST-005-RESERVATIONS
  category: reservation_propagation
  invokes: attach_interpretation_annotations
  scenario: Execute with all feature unresolved IDs and provisional assumptions attached.
  expected_structural_effect: The output retains the exact unresolved and assumption ID sets and makes no resolution claim.
- id: TEST-005-CONFORMANCE
  category: contract_ir_conformance
  invokes: attach_interpretation_annotations
  scenario: Compare callable, input type, output type, errors, postconditions, and readiness across contract and IR.
  expected_structural_effect: All specialized interface fields and readiness values agree.
numeric_expected_results: []
implementation_status: ready_for_operation_specific_test_implementation
operation_under_test: attach_interpretation_annotations
