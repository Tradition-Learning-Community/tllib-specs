name: Phase 4 final authoritative global registry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase4-global-registry-final.yml'
      - 'tools/global-reconciliation/**'
      - 'registry/global-reconciliation/**'
      - 'reports/global-reconciliation/**'

concurrency:
  group: phase4-global-registry-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  build-validate-and-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Fetch canonical main
        run: git fetch origin main --quiet

      - name: Build authoritative global registry
        run: python tools/global-reconciliation/build_current_global_registry.py --root .

      - name: Validate authoritative global registry
        run: python tools/global-reconciliation/validate_current_global_registry.py --root .

      - name: Validate whitespace
        run: git diff --check

      - name: Remove temporary workflow files
        run: |
          rm -f .github/workflows/phase4-global-registry-final.yml
          rm -rf tools/global-reconciliation/__pycache__

      - name: Commit final generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(registry): regenerate authoritative current baseline"
          git pull --rebase origin phase4/global-registry-current-001
          git push origin HEAD:phase4/global-registry-current-001
