name: Principle finalization validation
on:
  push:
    branches: [phase4/principle-domain-finalization-001]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/domain-finalization/validate_principle_finalization.py
      - run: git diff --check c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD
      - run: test -z "$(git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | grep '^maths/' || true)"
      - run: test -z "$(git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | grep '^registry/global-reconciliation/' || true)"
