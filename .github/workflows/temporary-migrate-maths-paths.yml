name: Temporary maths path migration runner

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/migrate-maths-source-paths'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/migrate-maths-source-paths
          fetch-depth: 0

      - name: Migrate scientific source paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = {
              'maths/00-master.md': 'maths/00-master/master.md',
              'maths/01-disciple.md': 'maths/01-disciple/disciple.md',
              'maths/02-community.md': 'maths/02-community/community.md',
              'maths/03-huit-dimensions-de-tl.md': 'maths/03-huit-dimensions-de-tl/huit-dimensions-de-tl.md',
              'maths/04-invariants.md': 'maths/04-invariants/invariants.md',
              'maths/05-dynamics.md': 'maths/05-dynamics/dynamics.md',
              'maths/06-theorems.md': 'maths/06-theorems/theorems.md',
              'maths/07-message.md': 'maths/07-message/message.md',
              'maths/08-principle.md': 'maths/08-principle/principle.md',
              'maths/09-values.md': 'maths/09-values/values.md',
              'maths/10-virtues.md': 'maths/10-virtues/virtues.md',
              'maths/11-capacities.md': 'maths/11-capacities/capacities.md',
              'maths/12-competencies.md': 'maths/12-competencies/competencies.md',
              'maths/13-practice.md': 'maths/13-practice/practice.md',
              'maths/14-lived-experience.md': 'maths/14-lived-experience/lived-experience.md',
              'maths/15-relations.md': 'maths/15-relations/relations.md',
          }

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          changed = 0
          for name in tracked:
              if not name:
                  continue
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  continue
              try:
                  raw = path.read_bytes()
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')
                  changed += 1

          print(f'Updated {changed} tracked text files.')
          PY

          git rm \
            maths/00-master.md \
            maths/01-disciple.md \
            maths/02-community.md \
            maths/03-huit-dimensions-de-tl.md \
            maths/04-invariants.md \
            maths/05-dynamics.md \
            maths/06-theorems.md \
            maths/07-message.md \
            maths/08-principle.md \
            maths/09-values.md \
            maths/10-virtues.md \
            maths/11-capacities.md \
            maths/12-competencies.md \
            maths/13-practice.md \
            maths/14-lived-experience.md \
            maths/15-relations.md

          if git grep -n -E 'maths/(00-master|01-disciple|02-community|03-huit-dimensions-de-tl|04-invariants|05-dynamics|06-theorems|07-message|08-principle|09-values|10-virtues|11-capacities|12-competencies|13-practice|14-lived-experience|15-relations)\.md' -- . ':!/.git'; then
            echo 'Historical scientific source paths remain.' >&2
            exit 1
          fi

      - name: Validate repository
        shell: bash
        run: |
          python tools/handoff/generate_catalog.py --check
          python tools/handoff/validate_handoff.py --self-test
          python tools/handoff/export_bundle.py --all --check --verify-determinism

      - name: Commit and push migration
        shell: bash
        run: |
          git config user.name 'Tradition Learning Community'
          git config user.email '264622793+TraditionLearningCommunity@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: migrate maths source paths'
          git push origin HEAD:agent/migrate-maths-source-paths
