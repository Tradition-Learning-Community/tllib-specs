name: Temporary Message finalization validation
on:
  push:
    branches:
      - phase4/message-domain-finalization-001
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Message finalization
        run: python tools/domain-finalization/validate_message_finalization.py
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Check modified paths
        run: |
          git diff --name-only origin/main...HEAD | tee /tmp/message-paths.txt
          ! grep -E '^(maths/|registry/global-reconciliation/)' /tmp/message-paths.txt
          ! grep -E '^registry/(domain-finalization|optimized-ir|algorithms|oracles)/((?!message/).)*' /tmp/message-paths.txt
