name: Temporary maths migration executor v2

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/migrate-maths-source-paths'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-maths-source-paths
          fetch-depth: 0
      - name: Apply migration
        run: python tools/temporary_migrate_maths_paths.py
      - name: Regenerate catalog
        run: python tools/handoff/generate_catalog.py --write
      - name: Validate catalog
        run: python tools/handoff/generate_catalog.py --check
      - name: Validate handoff
        run: python tools/handoff/validate_handoff.py --self-test
      - name: Validate deterministic exports
        run: python tools/handoff/export_bundle.py --all --check --verify-determinism
      - name: Commit and push
        run: |
          git config user.name 'Tradition Learning Community'
          git config user.email '264622793+TraditionLearningCommunity@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: migrate maths source paths'
          git push origin HEAD:agent/migrate-maths-source-paths
