name: Feature handoff validation

on:
  pull_request:
    branches: [main, handoff/integration-v1]
    paths:
      - 'handoff/**'
      - 'tools/handoff/**'
      - 'tools/domain-progress/**'
      - 'registry/domain-progress/**'
      - 'reports/handoff/**'
      - 'README.md'
      - '.github/workflows/*handoff*'
  push:
    branches: [main, handoff/integration-v1]
    paths:
      - 'handoff/**'
      - 'tools/handoff/**'
      - 'tools/domain-progress/**'
      - 'registry/domain-progress/**'
      - 'reports/handoff/**'
      - 'README.md'
      - '.github/workflows/*handoff*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate finalized handoff v1.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check --quiet jsonschema pyyaml
      - name: Materialize exact deterministic global catalog on PR branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python tools/handoff/generate_catalog.py --write
          python tools/handoff/generate_catalog.py --check
          python tools/handoff/materialize_catalog.py
          exit 1
      - name: Validate published domains and feature packages
        id: validate
        shell: bash
        run: |
          set +e
          output="$(python tools/handoff/validate_handoff.py 2>&1)"
          status=$?
          printf '%s\n' "$output" | tee handoff-validation.log
          if [ "$status" -ne 0 ]; then
            diagnostic="$(printf '%s\n' "$output" | tail -n 1 | tr -cs '[:alnum:]_.-' '-' | cut -c1-120)"
            printf 'diagnostic=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
      - name: Run finalized validation logical scenarios
        run: python tools/handoff/validate_handoff.py --self-test
      - name: Validate domains 16-35 extension publication
        run: python tools/domain-progress/validate_extension_16_35.py
      - name: Validate all standalone exports and determinism
        run: python tools/handoff/export_bundle.py --all --check --verify-determinism
      - name: Reject committed bundle archives
        shell: bash
        run: |
          if find handoff -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \) -print -quit | grep -q .; then
            echo 'Committed bundle archive found under handoff/.' >&2
            exit 1
          fi
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-validation-${{ steps.validate.outputs.diagnostic || 'non-validator-failure' }}
          path: handoff-validation.log
          if-no-files-found: ignore
