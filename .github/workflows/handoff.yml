name: Feature handoff validation

on:
  pull_request:
    branches: [main, handoff/integration-v1]
    paths:
      - 'handoff/domains/**'
      - 'handoff/schemas/**'
      - 'handoff/features/**'
      - 'handoff/shared/**'
      - 'handoff/catalog.json'
      - 'handoff/README.md'
      - 'tools/handoff/**'
      - 'reports/handoff/infrastructure/**'
      - 'README.md'
      - '.github/workflows/*handoff*'
  push:
    branches: [main, handoff/integration-v1]
    paths:
      - 'handoff/domains/**'
      - 'handoff/schemas/**'
      - 'handoff/features/**'
      - 'handoff/shared/**'
      - 'handoff/catalog.json'
      - 'handoff/README.md'
      - 'tools/handoff/**'
      - 'reports/handoff/infrastructure/**'
      - 'README.md'
      - '.github/workflows/*handoff*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate handoff v1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check --quiet jsonschema pyyaml
      - name: Validate packages, schemas, and progressive populations
        id: validate
        shell: bash
        run: |
          set +e
          output="$(python tools/handoff/validate_handoff.py 2>&1)"
          status=$?
          printf '%s\n' "$output" | tee handoff-validation.log
          if [ "$status" -ne 0 ]; then
            diagnostic="$(printf '%s\n' "$output" | tail -n 1 | tr -cs '[:alnum:]_.-' '-' | cut -c1-120)"
            printf 'diagnostic=%s\n' "$diagnostic" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
      - name: Run progressive validation logical scenarios
        run: python tools/handoff/validate_handoff.py --self-test
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-validation-${{ steps.validate.outputs.diagnostic }}
          path: handoff-validation.log
          if-no-files-found: error
      - name: Resolve pilot bundle without writing artifacts
        run: python tools/handoff/export_bundle.py TLC-FC-00-MASTER-005 --check
