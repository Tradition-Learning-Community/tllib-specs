name: Disciple finalization validation

on:
  push:
    branches:
      - phase4/disciple-domain-finalization-001
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-disciple-finalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Install validator dependency
        run: python -m pip install -q PyYAML
      - name: Parse domain finalization YAML
        run: python -c "from pathlib import Path; import yaml; files=sorted(Path('registry/domain-finalization/disciple').rglob('*.yaml')); [yaml.safe_load(p.read_text(encoding='utf-8-sig')) for p in files]; print('domain_yaml=passed')"
      - name: Parse optimized IR YAML
        run: python -c "from pathlib import Path; import yaml; files=sorted(Path('registry/optimized-ir/disciple').rglob('*.yaml')); [yaml.safe_load(p.read_text(encoding='utf-8-sig')) for p in files]; print('optimized_ir_yaml=passed')"
      - name: Parse algorithm YAML
        run: python -c "from pathlib import Path; import yaml; files=sorted(Path('registry/algorithms/disciple').rglob('*.yaml')); [yaml.safe_load(p.read_text(encoding='utf-8-sig')) for p in files]; print('algorithm_yaml=passed')"
      - name: Parse oracle YAML
        run: python -c "from pathlib import Path; import yaml; files=sorted(Path('registry/oracles/disciple').rglob('*.yaml')); [yaml.safe_load(p.read_text(encoding='utf-8-sig')) for p in files]; print('oracle_yaml=passed')"
      - name: Check authoritative population
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          ids = [f'TLC-FC-01-DISCIPLE-{i:03d}' for i in range(1, 11)]
          load = lambda p: yaml.safe_load(Path(p).read_text(encoding='utf-8-sig'))
          baseline = load('registry/global-reconciliation/current-baseline.yaml')
          disciple = next(x for x in baseline['domains'] if x['domain_id'] == 'disciple')
          assert disciple['feature_count'] == 10
          matrix = load('registry/global-reconciliation/domain-feature-matrix.yaml')
          assert [r['feature_id'] for r in matrix['rows'] if r['domain'] == 'disciple'] == ids
          assert load('registry/domain-finalization/disciple/feature-status.yaml')['feature_count'] == 10
          assert load('registry/domain-finalization/disciple/manifest.yaml')['active_features'] == ids
          assert load('registry/domain-finalization/disciple/module-specification.yaml')['features'] == ids
          assert [x['feature_id'] for x in load('registry/domain-finalization/disciple/implementation-tasks.yaml')['feature_tasks']] == ids
          print('population=passed')
          PY
      - name: Check optimized IR schema
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          required = {'feature_id','source_contract_ref','source_ir_ref','source_ir_status','representation_type','inputs','outputs','types','opaque_values','preconditions','operations','execution_order','control_flow','states','effects','postconditions','invariants','errors','determinism','dependencies','unresolved_propagated','reservations','links_to_tests','transformations_applied','preservation_obligations','implementation_readiness'}
          for i in range(1, 11):
              fid = f'TLC-FC-01-DISCIPLE-{i:03d}'
              data = yaml.safe_load(Path(f'registry/optimized-ir/disciple/{fid}/ir.yaml').read_text(encoding='utf-8-sig'))
              assert data['status'] == 'selected_for_disciple_implementation_specification', fid
              assert required <= set(data), (fid, sorted(required - set(data)))
              assert data['source_ir_preserved'] is True
              assert data['source_contract_preserved'] is True
              assert data['scientific_source_modified'] is False
              assert data['replaces_source_ir'] is False
              assert 'OpaqueScientificValue' in data['types']['shared']
          print('optimized_ir_schema=passed')
          PY
      - name: Check preservation and unresolved
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          load = lambda p: yaml.safe_load(Path(p).read_text(encoding='utf-8-sig'))
          status = {x['feature_id']: x for x in load('registry/domain-progress/disciple/feature-status.yaml')['features']}
          for i in range(1, 11):
              fid = f'TLC-FC-01-DISCIPLE-{i:03d}'
              source = json.loads(Path(f'ir/{fid}/ir.candidate.json').read_text(encoding='utf-8-sig'))
              questions = load(f'registry/math-contracts/{fid}/open-math-questions.yaml')
              final = load(f'registry/optimized-ir/disciple/{fid}/ir.yaml')
              expected_u = list(source.get('unresolved', [])) + list(questions.get('questions', []))
              assert set(expected_u) <= set(final['unresolved_propagated']), (fid, expected_u, final['unresolved_propagated'])
              expected_m = list(dict.fromkeys(list(source.get('master_subsymbols_unresolved', [])) + list(questions.get('master_subsymbols_unresolved', []))))
              assert expected_m == final['opaque_values']['master_subsymbols'], (fid, expected_m, final['opaque_values']['master_subsymbols'])
              assert set(status[fid].get('scientific_unresolved', [])) <= set(final['reservations']), fid
          print('preservation=passed')
          PY
      - name: Check algorithms and oracles
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          load = lambda p: yaml.safe_load(Path(p).read_text(encoding='utf-8-sig'))
          fields = {'signature','inputs','outputs','validations','preconditions','ordered_steps','branches','state_transitions','errors','postconditions','invariants','determinism','effects','edge_cases','unresolved_preserved','dependencies','complexity','pseudocode'}
          for i in range(1, 11):
              fid = f'TLC-FC-01-DISCIPLE-{i:03d}'
              alg = load(f'registry/algorithms/disciple/{fid}/algorithm.yaml')
              oracle = load(f'registry/oracles/disciple/{fid}/oracle.yaml')
              assert fields <= set(alg), (fid, sorted(fields - set(alg)))
              assert alg['optimized_ir_ref'] == f'registry/optimized-ir/disciple/{fid}/ir.yaml'
              assert oracle['optimized_ir_ref'] == f'registry/optimized-ir/disciple/{fid}/ir.yaml'
              assert oracle['algorithm_ref'] == f'registry/algorithms/disciple/{fid}/algorithm.yaml'
              assert oracle['source_test_plan_ref'] == f'registry/test-plans/{fid}/test-plan.yaml'
              assert oracle['acceptance_tests']
              assert oracle['numerical_expected_results'] == []
          print('algorithms_oracles=passed')
          PY
      - name: Run complete validator
        env:
          DISCIPLE_ALLOW_TEMP_WORKFLOW: '1'
        run: python tools/domain-finalization/validate_disciple_finalization.py
      - name: Check diff and scope
        run: |
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -E '^(maths/|registry/global-reconciliation/|registry/math-contracts/|registry/ir/|ir/TLC-FC-01-DISCIPLE-)' ; then
            echo 'Forbidden source or global path changed'
            exit 1
          fi
          if echo "$changed" | grep -Ei '(master|\.(cpp|cc|cxx|h|hh|hpp|pyi)$|reference[-_]implementation)' ; then
            echo 'Forbidden Master, implementation, binding, or reference-implementation path changed'
            exit 1
          fi
