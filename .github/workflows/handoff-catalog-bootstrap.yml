# Temporary GitHub-only catalog regeneration workflow. Removed before final merge.
name: Bootstrap finalized handoff catalog

on:
  pull_request:
    branches:
      - handoff/integration-v1
    paths:
      - tools/handoff/generate_catalog.py
      - handoff/domains/**
      - handoff/features/**
      - handoff/shared/**
      - .github/workflows/handoff-catalog-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'handoff/global-finalization-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: handoff/global-finalization-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate finalized catalog
        run: python tools/handoff/generate_catalog.py --write
      - name: Commit deterministic catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add handoff/catalog.json
          if git diff --cached --quiet; then
            echo 'Catalog already current.'
            exit 0
          fi
          git commit -m 'feat(handoff): regenerate finalized 166-feature catalog'
          git push origin HEAD:handoff/global-finalization-v1
