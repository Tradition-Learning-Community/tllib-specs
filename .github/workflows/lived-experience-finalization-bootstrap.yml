name: Validate Lived Experience finalization

on:
  push:
    branches:
      - phase4/lived-experience-domain-finalization-001
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/lived-experience-domain-finalization-001
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run domain validator
        env:
          ALLOW_TEMP_WORKFLOW: '1'
        run: python tools/domain-finalization/validate_lived_experience_finalization.py
      - name: Verify final diff
        run: |
          git diff --check c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD
          test -z "$(git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | grep '^maths/' || true)"
          test -z "$(git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | grep '^registry/global-reconciliation/' || true)"
      - name: Record success and remove temporary workflow
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('reports/domain-finalization/lived-experience/finalization-report.md')
          text = path.read_text(encoding='utf-8').replace('PENDING_GITHUB_VALIDATION', 'PASSED_ON_GITHUB')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lived-experience-finalization-bootstrap.yml
          git add reports/domain-finalization/lived-experience/finalization-report.md
          git commit -m "chore(lived-experience): record validation and remove temporary workflow"
          git push origin phase4/lived-experience-domain-finalization-001
