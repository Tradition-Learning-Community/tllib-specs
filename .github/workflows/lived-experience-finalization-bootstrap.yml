name: Lived Experience finalization bootstrap

on:
  push:
    branches:
      - phase4/lived-experience-domain-finalization-001

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'chore(lived-experience): bootstrap domain finalization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase4/lived-experience-domain-finalization-001
          fetch-depth: 0

      - name: Install YAML support
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Generate Lived Experience specification package
        env:
          TLC_BASE_COMMIT: c34d40713bf444d38f92f76e1c6239ee596d5a18
          TLC_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          cat > /tmp/generate_lived_experience.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from typing import Any

          import yaml

          ROOT = Path.cwd()
          BASE = os.environ["TLC_BASE_COMMIT"]
          RUN_ID = os.environ.get("TLC_WORKFLOW_RUN_ID", "unknown")
          DOMAIN = "lived-experience"
          EXPECTED = [
              "TLC-FC-14-LIVED-EXPERIENCE-001",
              "TLC-FC-14-LIVED-EXPERIENCE-002",
              "TLC-FC-14-LIVED-EXPERIENCE-004",
              "TLC-FC-14-LIVED-EXPERIENCE-005",
              "TLC-FC-14-LIVED-EXPERIENCE-006",
              "TLC-FC-14-LIVED-EXPERIENCE-007",
              "TLC-FC-14-LIVED-EXPERIENCE-008",
              "TLC-FC-14-LIVED-EXPERIENCE-009",
              "TLC-FC-14-LIVED-EXPERIENCE-010",
              "TLC-FC-14-LIVED-EXPERIENCE-011",
              "TLC-FC-14-LIVED-EXPERIENCE-012",
              "TLC-FC-14-LIVED-EXPERIENCE-013",
          ]
          BLOCKED = set(EXPECTED) - {
              "TLC-FC-14-LIVED-EXPERIENCE-005",
              "TLC-FC-14-LIVED-EXPERIENCE-009",
              "TLC-FC-14-LIVED-EXPERIENCE-011",
          }
          SCIENTIFIC_REQUESTS = [
              "numeric_scoring",
              "threshold_evaluation",
              "time_evolution",
              "event_chronology_inference",
              "synergy_evaluation",
              "metric_evaluation",
              "probability_evaluation",
              "causal_effect",
              "psychological_interpretation",
              "scientific_resolution",
          ]

          def load_yaml(path: str) -> dict[str, Any]:
              data = yaml.safe_load((ROOT / path).read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise ValueError(f"Expected mapping in {path}")
              return data

          def write_yaml(path: str, data: dict[str, Any]) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(
                  yaml.safe_dump(data, allow_unicode=True, sort_keys=False, width=110),
                  encoding="utf-8",
              )

          def write_text(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.rstrip() + "\n", encoding="utf-8")

          def git_blob(path: str) -> str:
              return subprocess.check_output(["git", "hash-object", path], text=True).strip()

          def sha256(path: str) -> str:
              return hashlib.sha256((ROOT / path).read_bytes()).hexdigest()

          matrix = load_yaml("registry/global-reconciliation/domain-feature-matrix.yaml")
          rows = [row for row in matrix.get("rows", []) if row.get("domain") == DOMAIN]
          population = [row["feature_id"] for row in rows]
          if population != EXPECTED:
              raise SystemExit(f"Unexpected population: {population}")

          production_plan = load_yaml("registry/domain-progress/lived-experience/contract-production-plan.yaml")
          plan_by_feature = {item["feature_id"]: item for item in production_plan.get("plans", [])}
          records: list[dict[str, Any]] = []
          source_hashes: list[dict[str, str]] = []

          for row in rows:
              feature_id = row["feature_id"]
              contract_path = row["contract_ref"]
              source_ir_path = row["ir_registry_ref"]
              test_plan_path = row["test_plan_ref"]
              external_ir_path = row.get("ir_artifact_ref")
              contract = load_yaml(contract_path)
              source_ir = load_yaml(source_ir_path)
              test_plan = load_yaml(test_plan_path)
              plan = plan_by_feature[feature_id]
              covered_objects = contract.get("covered_objects", []) or []
              object_ids = [item["object_id"] for item in covered_objects]
              source_refs = contract.get("source_references", []) or []
              sections = []
              for ref in source_refs:
                  section = ref.get("section") or "unspecified_source_section"
                  span = f"{ref.get('start_line')}-{ref.get('end_line')}"
                  marker = {"section": section, "source_path": ref.get("source_path"), "line_span": span}
                  if marker not in sections:
                      sections.append(marker)
              declared_relations = list(contract.get("covered_relations", []) or []) + list(
                  contract.get("contextual_relations", []) or []
              )
              raw_status = row.get("selection_status")
              source_ir_kind = source_ir.get("ir_kind")
              propagated_unresolved = list(source_ir.get("propagated_unresolved", []) or [])
              reservations = list(source_ir.get("propagated_reservations", []) or [])
              if feature_id == "TLC-FC-14-LIVED-EXPERIENCE-005":
                  for item in ["UNRES-N", "UNRES-EXPERIENCE-TYPE", "UNRES-SIGMA", "UNRES-SYNERGY"]:
                      if item not in propagated_unresolved:
                          propagated_unresolved.append(item)
              blocked = feature_id in BLOCKED
              final_ir_path = f"registry/optimized-ir/lived-experience/{feature_id}/ir.yaml"
              algorithm_path = f"registry/algorithms/lived-experience/{feature_id}/algorithm.yaml"
              oracle_path = f"registry/oracles/lived-experience/{feature_id}/oracle.yaml"
              object_records = []
              for obj in covered_objects:
                  object_records.append(
                      {
                          "object_id": obj.get("object_id"),
                          "canonical_name": obj.get("canonical_name"),
                          "object_type": obj.get("object_type"),
                          "source_status": obj.get("status"),
                          "symbols": obj.get("symbols", []) or [],
                          "source_statement": obj.get("source_statement"),
                      }
                  )

              final_ir = {
                  "schema_version": 1,
                  "status": "selected_for_lived_experience_implementation_specification",
                  "feature_id": feature_id,
                  "source_contract": {"path": contract_path, "contract_id": contract.get("contract_id")},
                  "source_ir": {
                      "path": source_ir_path,
                      "ir_id": source_ir.get("ir_id"),
                      "raw_status": raw_status,
                      "raw_ir_kind": source_ir_kind,
                      "external_artifact_path": external_ir_path if external_ir_path != source_ir_path else None,
                  },
                  "source_test_plan": {"path": test_plan_path, "test_plan_id": test_plan.get("test_plan_id")},
                  "ir_nature": "declarative",
                  "experience": {
                      "representation": "ordered_external_scientific_object_references",
                      "ordered_object_ids": object_ids,
                      "objects": object_records,
                      "scientific_value": "opaque_not_evaluated",
                  },
                  "identity": {
                      "feature_id": feature_id,
                      "ordered_object_ids": object_ids,
                      "identity_rule": "feature_id and ordered covered object identifiers are conserved exactly",
                  },
                  "scope": {
                      "contract_scope": contract.get("scope") or "exactly_the_covered_source_objects",
                      "source_sections": sections,
                      "boundary_status": plan.get("classification"),
                  },
                  "context": {
                      "declared_source_context": sections,
                      "runtime_context_schema": None,
                      "status": "descriptive_scope_only",
                  },
                  "actors_explicitly_defined": [],
                  "inputs": contract.get("inputs", []) or [],
                  "outputs": contract.get("outputs", []) or [],
                  "types": {
                      "contract_types": contract.get("types", {}) or {},
                      "opaque": source_ir.get("opaque_types", []) or [],
                      "parameterized": source_ir.get("parameterized_types", []) or [],
                      "symbolic": source_ir.get("symbolic_types", []) or [],
                  },
                  "opaque_values": [
                      "object_payloads",
                      "source_statements",
                      "unevaluated_symbols_and_expressions",
                      "unresolved_scientific_values",
                  ],
                  "preconditions": contract.get("preconditions", []) or [],
                  "conditions_of_application": contract.get("preconditions", []) or [],
                  "events_explicitly_defined": [],
                  "states_explicitly_defined": [],
                  "order": {
                      "covered_object_order": object_ids,
                      "temporal_order": [],
                      "temporal_order_status": "not_declared_by_selected_contract_or_ir",
                  },
                  "operations": source_ir.get("operations", []) or [],
                  "control_flow": source_ir.get("operation_sequence", []) or [],
                  "transitions_explicitly_defined": [],
                  "observations_explicitly_defined": [],
                  "perceptions_explicitly_defined": [],
                  "interpretations_explicitly_defined": [],
                  "results_explicitly_defined": [],
                  "effects_explicitly_defined": [],
                  "relations_explicitly_defined": declared_relations,
                  "postconditions": contract.get("postconditions", []) or [],
                  "invariants": contract.get("explicitly_sourced_invariants", source_ir.get("invariants", [])) or [],
                  "errors": contract.get("errors", []) or [],
                  "determinism": {
                      "structural_descriptor": source_ir.get("determinism_status"),
                      "scientific_operation": (contract.get("behavior", {}) or {}).get("determinism", {}).get("status", "not_declared"),
                  },
                  "dependencies": {
                      "documentary": [contract_path, source_ir_path, test_plan_path, "maths/14-lived-experience.md"],
                      "scientific_reconciliation": plan.get("required_external_reconciliation", []) or [],
                      "execution": [],
                      "source_declared": contract.get("dependencies", {}) or {},
                  },
                  "unresolved_propagated": propagated_unresolved,
                  "domain_unresolved_registry": "registry/scientific-objects/lived-experience/unresolved-terms.yaml",
                  "reservations": reservations,
                  "undefined_behaviors": contract.get("undefined_behaviors", []) or [],
                  "transformations_applied_to_ir": [
                      "normalized_field_order",
                      "explicit_semantic_absence_slots",
                      "normalized_traceability_links",
                      "shared_structural_error_envelope",
                      "no_scientific_operation_added",
                  ],
                  "preservation_obligations": [
                      "preserve feature identity",
                      "preserve ordered covered objects",
                      "preserve source statements and symbols as opaque values",
                      "preserve source provenance",
                      "preserve unresolved and reservations",
                      "reject undeclared scientific evaluation",
                  ],
                  "algorithm_ref": algorithm_path,
                  "oracle_ref": oracle_path,
                  "implementation_aptitude": {
                      "structural_descriptor": "ready_for_declarative_descriptor_implementation",
                      "scientific_execution": "blocked_or_not_authorized_by_sources",
                      "production_readiness_asserted": False,
                      "source_raw_readiness_preserved": True,
                      "local_scientific_blocker": blocked,
                  },
                  "source_ir_preserved": True,
                  "source_contract_preserved": True,
                  "replaces_source_ir": False,
                  "scientific_source_modified": False,
                  "experience_invented": False,
                  "event_invented": False,
                  "state_invented": False,
                  "chronology_invented": False,
                  "interpretation_invented": False,
                  "causality_invented": False,
              }
              write_yaml(final_ir_path, final_ir)

              entrypoint = source_ir.get("entrypoint") or feature_id.lower().replace("-", "_")
              pseudocode = "\n".join(
                  [
                      f"FUNCTION {entrypoint}(feature_id, object_payloads, provenance):",
                      f"  REQUIRE feature_id == {feature_id} ELSE RAISE UnknownFeatureId",
                      f"  REQUIRE supplied object identifiers equal {json.dumps(object_ids)}",
                      "  REQUIRE every required object appears exactly once ELSE RAISE MissingCoveredObject or DuplicateCoveredObject",
                      "  REQUIRE every required object has a source reference ELSE RAISE MissingSourceReference",
                      "  DO NOT inspect or interpret opaque payload internals",
                      "  BUILD an immutable descriptor from the ordered object identifiers, source statements, symbols, provenance, unresolved and reservations",
                      "  PRESERVE all source ordering and opaque values exactly",
                      "  RETURN the descriptor",
                      "",
                      "FUNCTION reject_scientific_evaluation_request(request_kind):",
                      f"  IF request_kind IN {json.dumps(SCIENTIFIC_REQUESTS)}:",
                      "    RAISE ScientificEvaluationRequested",
                      "  OTHERWISE delegate only to a separately authorized external component",
                  ]
              )
              algorithm = {
                  "schema_version": 1,
                  "feature_id": feature_id,
                  "status": "selected_for_lived_experience_implementation_specification",
                  "source_contract_ref": contract_path,
                  "source_ir_ref": source_ir_path,
                  "finalized_ir_ref": final_ir_path,
                  "nature": "structural_declarative_algorithm",
                  "signature": f"{entrypoint}(FeatureId, Map<ObjectId,OpaqueScientificObject>, Map<ObjectId,SourceReference>) -> LivedExperienceDescriptor",
                  "guard_signature": "reject_scientific_evaluation_request(RequestKind) -> never",
                  "inputs": contract.get("inputs", []) or [],
                  "outputs": contract.get("outputs", []) or [],
                  "validations": [
                      "feature identifier equals the selected feature",
                      "covered object identifiers equal the authoritative ordered set",
                      "each covered object appears exactly once",
                      "each covered object has provenance",
                      "no scientific evaluation request is accepted",
                  ],
                  "preconditions": contract.get("preconditions", []) or [],
                  "conditions_of_application": contract.get("preconditions", []) or [],
                  "ordered_steps": [
                      "validate feature identity",
                      "validate ordered object set and uniqueness",
                      "validate provenance completeness",
                      "construct immutable descriptor without scientific interpretation",
                      "propagate unresolved and reservations",
                      "return descriptor",
                  ],
                  "branching": [
                      {"condition": "wrong feature identifier", "action": "raise UnknownFeatureId"},
                      {"condition": "missing or duplicate covered object", "action": "raise structural object error"},
                      {"condition": "missing provenance", "action": "raise MissingSourceReference"},
                      {"condition": "scientific operation requested", "action": "raise ScientificEvaluationRequested"},
                  ],
                  "experience_processing": "read and preserve external scientific object references only",
                  "identity_validation": {"feature_id": feature_id, "ordered_object_ids": object_ids},
                  "scope_validation": "accept only the exact contract source objects and source sections",
                  "context_validation": "preserve source context as provenance; no runtime context semantics inferred",
                  "actor_processing": "none; no structured actor declaration in the selected contract or IR",
                  "event_processing": "none; no structured event declaration in the selected contract or IR",
                  "state_processing": "none; no structured state declaration in the selected contract or IR",
                  "transitions": [],
                  "observations": [],
                  "interpretations": [],
                  "results_and_effects": [],
                  "errors": contract.get("errors", []) or [],
                  "postconditions": contract.get("postconditions", []) or [],
                  "invariants": contract.get("explicitly_sourced_invariants", []) or [],
                  "determinism": source_ir.get("determinism_status"),
                  "edge_cases": [
                      "empty supplied object collection",
                      "extra undeclared object",
                      "duplicate object before map construction",
                      "missing provenance",
                      "opaque payload with unknown internal representation",
                      "unsupported scientific request",
                  ],
                  "dependencies": {"execution": [], "documentary": [contract_path, source_ir_path]},
                  "unresolved_preserved": propagated_unresolved,
                  "pseudocode": pseudocode,
                  "forbidden_operations": SCIENTIFIC_REQUESTS,
              }
              write_yaml(algorithm_path, algorithm)

              source_cases = test_plan.get("test_cases", []) or []
              acceptance = [
                  {
                      "test_id": "LE-ACC-IDENTITY",
                      "category": "identity",
                      "assertion": f"descriptor feature_id equals {feature_id} and ordered object ids equal {object_ids}",
                  },
                  {
                      "test_id": "LE-ACC-PROVENANCE",
                      "category": "traceability",
                      "assertion": "each covered object retains its exact source reference",
                  },
                  {
                      "test_id": "LE-ACC-OPAQUE",
                      "category": "opaque_value_propagation",
                      "assertion": "opaque payload identities, source statements and symbols are preserved without inspection",
                  },
                  {
                      "test_id": "LE-ACC-UNRESOLVED",
                      "category": "unresolved_propagation",
                      "assertion": f"all source unresolved are present: {propagated_unresolved}",
                  },
                  {
                      "test_id": "LE-ACC-NO-INVENTION",
                      "category": "structural",
                      "assertion": "actors, events, states, temporal order, transitions, observations, perceptions, interpretations, results, effects and relations remain empty unless sourced",
                  },
                  {
                      "test_id": "LE-ACC-DETERMINISM",
                      "category": "determinism",
                      "assertion": "identical structural inputs produce structurally identical descriptors",
                  },
                  {
                      "test_id": "LE-ACC-ROUNDTRIP",
                      "category": "serialization_round_trip",
                      "assertion": "lossless serialization and deserialization preserve every field, order, opaque identifier, unresolved and reservation",
                  },
                  {
                      "test_id": "LE-ACC-REJECT-SCIENCE",
                      "category": "errors",
                      "assertion": f"each unsupported request is rejected: {SCIENTIFIC_REQUESTS}",
                  },
              ]
              if feature_id == "TLC-FC-14-LIVED-EXPERIENCE-005":
                  acceptance.extend(
                      [
                          {
                              "test_id": "LE-005-EQUATION-PRESERVED",
                              "category": "source_expression",
                              "assertion": "the collective-memory equation is preserved verbatim as an unevaluated expression",
                          },
                          {
                              "test_id": "LE-005-UNRESOLVED-N-SYNERGY",
                              "category": "unresolved_propagation",
                              "assertion": "N domain, experience type, sigma and Synergie remain unresolved and prevent scientific evaluation",
                          },
                      ]
                  )
              if feature_id == "TLC-FC-14-LIVED-EXPERIENCE-004":
                  acceptance.append(
                      {
                          "test_id": "LE-004-NO-TEMPORAL-SOLVER",
                          "category": "chronology_non_invention",
                          "assertion": "no timestep, solver, duration, stochastic process realization or trajectory is produced",
                      }
                  )
              if feature_id == "TLC-FC-14-LIVED-EXPERIENCE-010":
                  acceptance.append(
                      {
                          "test_id": "LE-010-NO-METRIC-EVALUATION",
                          "category": "metric_non_invention",
                          "assertion": "the three source metric expressions are preserved but no numeric value or division policy is produced",
                      }
                  )
              if feature_id == "TLC-FC-14-LIVED-EXPERIENCE-011":
                  acceptance.append(
                      {
                          "test_id": "LE-011-OBJECT-ORDER",
                          "category": "order",
                          "assertion": "object 043 precedes object 051 exactly; this is object inventory order, not temporal order",
                      }
                  )
              if feature_id == "TLC-FC-14-LIVED-EXPERIENCE-012":
                  acceptance.append(
                      {
                          "test_id": "LE-012-SIGNATURES-PRESERVED",
                          "category": "source_expression",
                          "assertion": "all five operator signatures remain ordered, opaque and unevaluated",
                      }
                  )

              oracle = {
                  "schema_version": 1,
                  "feature_id": feature_id,
                  "status": "selected_for_lived_experience_implementation_specification",
                  "source_contract_ref": contract_path,
                  "source_ir_ref": source_ir_path,
                  "source_test_plan_ref": test_plan_path,
                  "finalized_ir_ref": final_ir_path,
                  "algorithm_ref": algorithm_path,
                  "oracle_kind": "structural_acceptance_oracle_with_scientific_non_invention",
                  "exact_scientific_result_oracle": "not_available_and_not_invented",
                  "source_test_cases": source_cases,
                  "acceptance_tests": acceptance,
                  "error_expectations": contract.get("errors", []) or [],
                  "property_tests": [
                      "identity and ordered covered objects are conserved",
                      "provenance is total for covered objects",
                      "source statements and symbols are opaque and unchanged",
                      "unresolved and reservations are monotonic: none may disappear",
                      "structural descriptor construction is deterministic",
                      "lossless serialization round-trip is identity-preserving",
                  ],
                  "metamorphic_tests": [
                      "repeating construction with identical structural inputs yields the same descriptor",
                      "adding an undeclared object changes success into a structural validation error",
                      "removing one provenance entry changes success into MissingSourceReference",
                  ],
                  "dependency_tests": [
                      "scientific reconciliation references are documentary/scientific only and create no execution dependency"
                  ],
                  "blocked_oracles": test_plan.get("blocked_tests", []) or [],
                  "non_goals": list(test_plan.get("non_goals", []) or []) + [
                      "no invented experience instance",
                      "no invented event or state",
                      "no invented chronology, duration or ordering",
                      "no invented observation, perception or interpretation",
                      "no invented measurement, score, cause or consequence",
                  ],
                  "acceptance_gate": "all structural tests pass and every unavailable scientific operation is rejected explicitly",
              }
              write_yaml(oracle_path, oracle)

              for source_path in [contract_path, source_ir_path, test_plan_path]:
                  source_hashes.append(
                      {"path": source_path, "git_blob_sha": git_blob(source_path), "sha256": sha256(source_path)}
                  )
              records.append(
                  {
                      "feature_id": feature_id,
                      "canonical_name": contract.get("canonical_name"),
                      "source_object_ids": object_ids,
                      "source_object_types": [obj.get("object_type") for obj in covered_objects],
                      "raw_selection_status": raw_status,
                      "source_ir_kind": source_ir_kind,
                      "source_execution_status": contract.get("execution_status"),
                      "contract_ref": contract_path,
                      "source_ir_ref": source_ir_path,
                      "source_ir_artifact_ref": external_ir_path,
                      "test_plan_ref": test_plan_path,
                      "finalized_ir_ref": final_ir_path,
                      "algorithm_ref": algorithm_path,
                      "oracle_ref": oracle_path,
                      "unresolved": propagated_unresolved,
                      "reservations": reservations,
                      "local_scientific_blocker": blocked,
                  }
              )

          maths_path = "maths/14-lived-experience.md"
          source_hashes.append({"path": maths_path, "git_blob_sha": git_blob(maths_path), "sha256": sha256(maths_path)})
          source_hashes = sorted(source_hashes, key=lambda item: item["path"])

          manifest = {
              "schema_version": 1,
              "domain_id": DOMAIN,
              "phase": "phase4_domain_finalization",
              "status": "implementation_specification_package_complete",
              "main_head_used": BASE,
              "branch": "phase4/lived-experience-domain-finalization-001",
              "authoritative_population_source": "registry/global-reconciliation/domain-feature-matrix.yaml",
              "baseline_source": "registry/global-reconciliation/current-baseline.yaml",
              "feature_count": len(records),
              "features": [record["feature_id"] for record in records],
              "source_science": maths_path,
              "source_hashes": source_hashes,
              "domain_sources": [
                  "registry/domain-progress/lived-experience/feature-inventory.yaml",
                  "registry/domain-progress/lived-experience/pattern-analysis.yaml",
                  "registry/domain-progress/lived-experience/concept-boundaries.yaml",
                  "registry/domain-progress/lived-experience/historical-artifact-assessment.yaml",
                  "registry/scientific-objects/lived-experience/unresolved-terms.yaml",
              ],
              "artifacts": {
                  "feature_status": "registry/domain-finalization/lived-experience/feature-status.yaml",
                  "patterns": "registry/domain-finalization/lived-experience/patterns.yaml",
                  "module_specification": "registry/domain-finalization/lived-experience/module-specification.yaml",
                  "implementation_tasks": "registry/domain-finalization/lived-experience/implementation-tasks.yaml",
                  "decision_required": "registry/domain-finalization/lived-experience/decision-required.yaml",
                  "report": "reports/domain-finalization/lived-experience/finalization-report.md",
                  "validator": "tools/domain-finalization/validate_lived_experience_finalization.py",
              },
              "per_feature_artifacts": [
                  {
                      "feature_id": record["feature_id"],
                      "ir": record["finalized_ir_ref"],
                      "algorithm": record["algorithm_ref"],
                      "oracle": record["oracle_ref"],
                  }
                  for record in records
              ],
              "constraints": {
                  "source_contracts_preserved": True,
                  "source_irs_preserved": True,
                  "maths_preserved": True,
                  "other_domains_modified": False,
                  "global_registry_regenerated": False,
                  "cpp_produced": False,
                  "python_bindings_produced": False,
                  "reference_implementation_produced": False,
                  "features_rejected": 0,
              },
              "validation": {
                  "github_actions_run_id": RUN_ID,
                  "validator_command": "python tools/domain-finalization/validate_lived_experience_finalization.py",
                  "diff_check": "git diff --check",
                  "commit_is_created_only_after_all_checks_pass": True,
              },
          }
          write_yaml("registry/domain-finalization/lived-experience/manifest.yaml", manifest)

          feature_status = {
              "schema_version": 1,
              "domain_id": DOMAIN,
              "authoritative_feature_count": len(records),
              "status_policy": "raw source statuses are preserved; final selection does not assert scientific or production readiness",
              "features": [
                  {
                      **record,
                      "final_status": "selected_for_lived_experience_implementation_specification",
