              if not (ROOT / path).is_file():
                  fail(f"missing required domain artifact: {path}")

          for item in manifest.get("source_hashes", []):
              path = item["path"]
              current_blob = git("hash-object", path)
              if current_blob != item["git_blob_sha"]:
                  fail(f"source file modified: {path}")

          changed: set[str] = set()
          if base:
              changed.update(filter(None, git("diff", "--name-only", f"{base}...HEAD").splitlines()))
          changed.update(filter(None, git("diff", "--cached", "--name-only").splitlines()))
          allowed_prefixes = (
              "registry/domain-finalization/lived-experience/",
              "registry/optimized-ir/lived-experience/",
              "registry/algorithms/lived-experience/",
              "registry/oracles/lived-experience/",
              "reports/domain-finalization/lived-experience/",
          )
          allowed_exact = {"tools/domain-finalization/validate_lived_experience_finalization.py"}
          if os.environ.get("ALLOW_TEMP_WORKFLOW") == "1":
              allowed_exact.add(".github/workflows/lived-experience-finalization-bootstrap.yml")
          illegal = sorted(path for path in changed if path not in allowed_exact and not path.startswith(allowed_prefixes))
          if illegal:
              fail(f"modified paths outside Lived Experience scope: {illegal}")
          if any(path.startswith("maths/") for path in changed):
              fail("maths/ modification detected")
          if any(path.startswith("registry/global-reconciliation/") for path in changed):
              fail("global reconciliation registry modification detected")
          forbidden_extensions = (".cpp", ".cc", ".cxx", ".hpp", ".hxx", ".pyi")
          if any(path.endswith(forbidden_extensions) for path in changed):
              fail("C++ or binding artifact detected")
          reference_markers = ("reference-implementation", "reference_implementation", "bindings/python")
          if any(any(marker in path for marker in reference_markers) for path in changed):
              fail("reference implementation or Python binding detected")
          if any("__pycache__" in path or path.endswith(".status") or path.endswith(".log") for path in changed):
              fail("temporary diagnostic artifact detected")

          constraints = manifest.get("constraints", {})
          required_constraints = {
              "source_contracts_preserved": True,
              "source_irs_preserved": True,
              "maths_preserved": True,
              "other_domains_modified": False,
              "global_registry_regenerated": False,
              "cpp_produced": False,
              "python_bindings_produced": False,
              "reference_implementation_produced": False,
              "features_rejected": 0,
          }
          for key, expected in required_constraints.items():
              if constraints.get(key) != expected:
                  fail(f"manifest constraint {key} mismatch")

          print("Lived Experience finalization validation passed")
          print("features=12 finalized_ir=12 algorithms=12 oracles=12")
          print(f"changed_paths={len(changed)} source_hashes={len(manifest.get('source_hashes', []))}")
          '''
          validator = "\n".join(line[10:] if line.startswith("          ") else line for line in validator.splitlines())
          write_text("tools/domain-finalization/validate_lived_experience_finalization.py", validator)

          print("Generated Lived Experience finalization package")
          print(f"features={len(records)} files=44")
          PY
          python /tmp/generate_lived_experience.py

