name: Validate Capacities finalization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Capacities validator
        run: python tools/domain-finalization/validate_capacities_finalization.py
      - name: Check diff whitespace
        run: git diff --check c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD
      - name: Verify changed paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | tee /tmp/capacities-paths.txt
          if grep -E '^(maths/|registry/global-reconciliation/|registry/math-contracts/|registry/ir/|registry/test-plans/)' /tmp/capacities-paths.txt; then
            echo 'Protected source or global path changed.' >&2
            exit 1
          fi
          if grep -E '\.(c|cc|cpp|cxx|h|hh|hpp)$' /tmp/capacities-paths.txt; then
            echo 'C or C++ file found.' >&2
            exit 1
          fi
