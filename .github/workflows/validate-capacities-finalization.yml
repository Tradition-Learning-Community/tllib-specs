name: Validate Capacities finalization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Validate authoritative population
        run: python -c "import runpy; runpy.run_path('tools/domain-finalization/validate_capacities_finalization.py')['validate_population']()"
      - name: Validate feature artifacts
        run: python -c "import runpy; runpy.run_path('tools/domain-finalization/validate_capacities_finalization.py')['validate_feature_artifacts']()"
      - name: Validate module package
        run: python -c "import runpy; runpy.run_path('tools/domain-finalization/validate_capacities_finalization.py')['validate_module_package']()"
      - name: Validate changed paths
        run: python -c "import runpy; runpy.run_path('tools/domain-finalization/validate_capacities_finalization.py')['validate_changed_paths']()"
      - name: Validate diff whitespace
        run: python -c "import runpy; runpy.run_path('tools/domain-finalization/validate_capacities_finalization.py')['validate_diff_whitespace']()"
      - name: Run complete Capacities validator
        run: python tools/domain-finalization/validate_capacities_finalization.py
      - name: Verify protected paths independently
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | tee /tmp/capacities-paths.txt
          if grep -E '^(maths/|registry/global-reconciliation/|registry/math-contracts/|registry/ir/|registry/test-plans/)' /tmp/capacities-paths.txt; then
            echo 'Protected source or global path changed.' >&2
            exit 1
          fi
          if grep -E '\.(c|cc|cpp|cxx|h|hh|hpp)$' /tmp/capacities-paths.txt; then
            echo 'C or C++ file found.' >&2
            exit 1
          fi
