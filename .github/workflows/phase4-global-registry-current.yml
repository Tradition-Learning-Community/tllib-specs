name: Phase 4 current global registry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase4-global-registry-current.yml'
      - 'tools/global-reconciliation/**'
      - 'registry/global-reconciliation/**'
      - 'reports/global-reconciliation/**'

concurrency:
  group: phase4-global-registry-current-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  rebuild-current-global-registry:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install registry dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Fetch canonical main
        run: git fetch origin main --quiet

      - name: Upgrade current registry builder
        run: |
          set -o pipefail
          python tools/global-reconciliation/upgrade_current_registry_builder.py 2>&1 | tee reports/global-reconciliation/current-baseline-upgrade.log
          echo ${PIPESTATUS[0]} > reports/global-reconciliation/current-baseline-upgrade.status

      - name: Finalize current registry builder
        run: |
          set -o pipefail
          python tools/global-reconciliation/finalize_current_registry_builder.py 2>&1 | tee reports/global-reconciliation/current-baseline-finalize.log
          echo ${PIPESTATUS[0]} > reports/global-reconciliation/current-baseline-finalize.status

      - name: Restore historical review provenance
        run: python tools/global-reconciliation/restore_historical_reconciliation_reviews.py

      - name: Rebuild current global registry
        run: |
          set -o pipefail
          python tools/global-reconciliation/build_current_global_registry.py --root . 2>&1 | tee reports/global-reconciliation/current-baseline-build.log
          echo ${PIPESTATUS[0]} > reports/global-reconciliation/current-baseline-build.status

      - name: Validate current global registry
        run: |
          set -o pipefail
          python tools/global-reconciliation/validate_current_global_registry.py --root . 2>&1 | tee reports/global-reconciliation/current-baseline-validation.log
          echo ${PIPESTATUS[0]} > reports/global-reconciliation/current-baseline-validation.status

      - name: Validate whitespace
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee reports/global-reconciliation/current-baseline-whitespace.log
          echo ${PIPESTATUS[0]} > reports/global-reconciliation/current-baseline-whitespace.status

      - name: Enforce generation and validation success
        run: |
          test "$(cat reports/global-reconciliation/current-baseline-upgrade.status)" = "0"
          test "$(cat reports/global-reconciliation/current-baseline-finalize.status)" = "0"
          test "$(cat reports/global-reconciliation/current-baseline-build.status)" = "0"
          test "$(cat reports/global-reconciliation/current-baseline-validation.status)" = "0"
          test "$(cat reports/global-reconciliation/current-baseline-whitespace.status)" = "0"

      - name: Remove temporary workflow machinery
        run: python tools/global-reconciliation/cleanup_phase4_current_registry_workflow.py

      - name: Commit final current registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(registry): finalize current 16-domain IR baseline"
          git pull --rebase origin phase4/global-registry-current-001
          git push origin HEAD:phase4/global-registry-current-001
