name: Community finalization validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VALIDATOR: tools/domain-finalization/validate_community_finalization.py

jobs:
  validate-community-finalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Install validator dependency
        run: python -m pip install -q --disable-pip-version-check pyyaml
      - name: Validate authoritative population
        run: python -c 'import runpy; n=runpy.run_path("tools/domain-finalization/validate_community_finalization.py"); n["validate_population"]()'
      - name: Validate all source chains
        run: python -c 'import runpy; n=runpy.run_path("tools/domain-finalization/validate_community_finalization.py"); [n["validate_source"](f) for f in n["FEATURES"]]'
      - name: Validate all IR algorithm oracle triplets
        run: python -c 'import runpy; n=runpy.run_path("tools/domain-finalization/validate_community_finalization.py"); [n["validate_triplet"](f) for f in n["FEATURES"]]'
      - name: Validate module documents
        run: python -c 'import runpy; n=runpy.run_path("tools/domain-finalization/validate_community_finalization.py"); n["validate_module"]()'
      - name: Validate changed paths and whitespace
        run: python -c 'import runpy; n=runpy.run_path("tools/domain-finalization/validate_community_finalization.py"); n["validate_paths"]()'
      - name: Run complete Community validator
        run: python tools/domain-finalization/validate_community_finalization.py
      - name: Verify protected scopes independently
        shell: bash
        run: |
          set -euo pipefail
          git diff --check c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD
          git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | tee /tmp/community-changed-paths.txt
          ! grep -E '^(maths/|registry/global-reconciliation/|registry/math-contracts/|registry/ir/|ir/)' /tmp/community-changed-paths.txt
          ! grep -Ei '(^|/)(master|disciple)(/|$)' /tmp/community-changed-paths.txt
          ! grep -Ei '\.(cpp|cc|cxx|h|hpp|pyi)$' /tmp/community-changed-paths.txt
          ! grep -Ei '(__pycache__|\.status$|\.log$)' /tmp/community-changed-paths.txt
