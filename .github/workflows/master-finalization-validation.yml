name: Temporary Master Finalization Validation

on:
  push:
    branches:
      - phase4/master-domain-finalization-001
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate package and publish commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MASTER_ALLOW_TEMP_WORKFLOW: '1'
          BASE_SHA: c34d40713bf444d38f92f76e1c6239ee596d5a18
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          output=$(python tools/domain-finalization/validate_master_finalization.py --base "$BASE_SHA" 2>&1)
          result=$?
          printf '%s\n' "$output"
          if [ "$result" -eq 0 ]; then
            state=success
            context='master-finalization/validator'
            description='16-feature Master finalization passed'
          else
            state=failure
            reason=$(printf '%s\n' "$output" | grep -E 'Error|Exception|validation failed' | tail -n 1 | sed 's/[^A-Za-z0-9._ -]/_/g' | cut -c1-80)
            if [ -z "$reason" ]; then reason='validator traceback'; fi
            context="master-finalization/$reason"
            description='Master finalization validation failed'
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\"}"
          exit "$result"
