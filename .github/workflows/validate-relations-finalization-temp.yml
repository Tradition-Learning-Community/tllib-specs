name: Temporary Relations finalization validation

'on':
  push:
    branches:
      - phase4/relations-domain-finalization-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run Relations validator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/domain-finalization/validate_relations_finalization.py > /tmp/relations-validator-output.txt 2>&1
          status=$?
          cat /tmp/relations-validator-output.txt
          if [ "$status" -ne 0 ]; then
            {
              echo 'Temporary Relations validator diagnostic:'
              echo
              echo '```text'
              cat /tmp/relations-validator-output.txt
              echo '```'
            } > /tmp/relations-validator-comment.md
            gh pr comment 91 --body-file /tmp/relations-validator-comment.md
            exit "$status"
          fi

      - name: Check diff whitespace
        run: git diff --check c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD

      - name: Show and verify changed paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | tee /tmp/relations-changed-paths.txt
          ! grep -E '^maths/' /tmp/relations-changed-paths.txt
          ! grep -E '^registry/global-reconciliation/' /tmp/relations-changed-paths.txt
          ! grep -E '^registry/(optimized-ir|algorithms|oracles)/' /tmp/relations-changed-paths.txt | grep -v '/relations/'
          ! grep -E '^registry/domain-finalization/' /tmp/relations-changed-paths.txt | grep -v '^registry/domain-finalization/relations/'
          ! grep -E '^reports/domain-finalization/' /tmp/relations-changed-paths.txt | grep -v '^reports/domain-finalization/relations/'

      - name: Verify no temporary artifacts
        shell: bash
        run: |
          set -euo pipefail
          ! find registry reports tools -type d -name '__pycache__' -print -quit | grep .
          ! find registry reports tools -type f \( -name '*.status' -o -name '*.log' -o -name '*.pyc' \) -print -quit | grep .
