name: Phase 4 final canonical-label correction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase4-global-registry-canonical-label.yml'
      - 'tools/global-reconciliation/**'
      - 'registry/global-reconciliation/**'
      - 'reports/global-reconciliation/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  correct-build-validate-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: git fetch origin main --quiet
      - name: Correct raw canonical-label classification
        run: python tools/global-reconciliation/fix_raw_canonical_label.py
      - name: Rebuild global registry
        run: python tools/global-reconciliation/build_current_global_registry.py --root .
      - name: Validate global registry
        run: python tools/global-reconciliation/validate_current_global_registry.py --root .
      - name: Validate whitespace
        run: git diff --check
      - name: Remove temporary files
        run: |
          rm -f .github/workflows/phase4-global-registry-canonical-label.yml
          rm -f tools/global-reconciliation/fix_raw_canonical_label.py
          rm -rf tools/global-reconciliation/__pycache__
      - name: Commit corrected generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(registry): correct canonical-label classification"
          git pull --rebase origin phase4/global-registry-current-001
          git push origin HEAD:phase4/global-registry-current-001
