name: Validate Competencies finalization

on:
  push:
    branches:
      - phase4/competencies-domain-finalization-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run Competencies finalization validator
        env:
          COMPETENCIES_ALLOW_TEMPORARY_VALIDATION_FILES: '1'
        run: python tools/domain-finalization/validate_competencies_finalization.py

      - name: Check whitespace errors
        run: git diff --check c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD

      - name: Verify changed paths
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(registry/domain-finalization/competencies/|registry/optimized-ir/competencies/|registry/algorithms/competencies/|registry/oracles/competencies/|reports/domain-finalization/competencies/|tools/domain-finalization/validate_competencies_finalization.py$|.github/workflows/validate-competencies-finalization.yml$|.github/competencies-finalization.trigger$)'
          git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD | while IFS= read -r path; do
            [[ "$path" =~ $allowed ]] || { echo "Out-of-scope path: $path"; exit 1; }
          done
          ! git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD | grep -E '^(maths/|registry/global-reconciliation/|registry/math-contracts/|registry/ir/|registry/test-plans/)' 
          ! git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD | grep -E '\.(cpp|cc|cxx|hpp|hh|h)$'
          ! git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD | grep -E '(__pycache__|\.status$|\.log$|\.cache/)'
