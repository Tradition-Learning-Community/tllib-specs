name: Validate Competencies finalization

on:
  push:
    branches:
      - phase4/competencies-domain-finalization-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      diagnostic_head: ${{ steps.validator.outputs.diagnostic_head }}
      diagnostic_tail: ${{ steps.validator.outputs.diagnostic_tail }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Install validator dependency
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - id: validator
        name: Run Competencies finalization validator
        env:
          COMPETENCIES_ALLOW_TEMPORARY_VALIDATION_FILES: '1'
        shell: bash
        run: |
          set +e
          output="$(python3 tools/domain-finalization/validate_competencies_finalization.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          diagnostic_head="$(printf '%s\n' "$output" | head -n 6 | tr '\n' '|' | cut -c1-220)"
          diagnostic_tail="$(printf '%s\n' "$output" | tail -n 6 | tr '\n' '|' | cut -c1-220)"
          echo "diagnostic_head=$diagnostic_head" >> "$GITHUB_OUTPUT"
          echo "diagnostic_tail=$diagnostic_tail" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Check whitespace errors
        run: git diff --check c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD

      - name: Verify changed paths
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(registry/domain-finalization/competencies/|registry/optimized-ir/competencies/|registry/algorithms/competencies/|registry/oracles/competencies/|reports/domain-finalization/competencies/|tools/domain-finalization/validate_competencies_finalization.py$|.github/workflows/validate-competencies-finalization.yml$|.github/competencies-finalization.trigger$)'
          git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD | while IFS= read -r path; do
            [[ "$path" =~ $allowed ]] || { echo "Out-of-scope path: $path"; exit 1; }
          done
          ! git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD | grep -E '^(maths/|registry/global-reconciliation/|registry/math-contracts/|registry/ir/|registry/test-plans/)'
          ! git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD | grep -E '\.(cpp|cc|cxx|hpp|hh|h)$'
          ! git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18..HEAD | grep -E '(__pycache__|\.status$|\.log$|\.cache/)'

  diagnostic-head:
    needs: validate
    if: always()
    name: "diagnostic-head ${{ needs.validate.outputs.diagnostic_head }}"
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s\n' '${{ needs.validate.outputs.diagnostic_head }}'

  diagnostic-tail:
    needs: validate
    if: always()
    name: "diagnostic-tail ${{ needs.validate.outputs.diagnostic_tail }}"
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s\n' '${{ needs.validate.outputs.diagnostic_tail }}'
