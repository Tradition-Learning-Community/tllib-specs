name: Temporary Practice finalization validation

on:
  push:
    branches: [phase4/practice-domain-finalization-001]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - id: validator
        name: Run Practice validator
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/domain-finalization/validate_practice_finalization.py 2>&1 | tee /tmp/practice-validator.log
      - id: whitespace
        name: Check whitespace
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --check c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD 2>&1 | tee /tmp/practice-whitespace.log
      - id: paths
        name: Check changed paths
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --name-only c34d40713bf444d38f92f76e1c6239ee596d5a18...HEAD | tee /tmp/practice-paths.txt
          ! grep -E '^(maths/|registry/global-reconciliation/|registry/math-contracts/|registry/ir/TLC-FC-13-PRACTICE-|registry/test-plans/)' /tmp/practice-paths.txt
          ! grep -E '\.(cpp|cc|cxx|hpp|h)$' /tmp/practice-paths.txt
      - name: Publish validation result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATOR_OUTCOME: ${{ steps.validator.outcome }}
          WHITESPACE_OUTCOME: ${{ steps.whitespace.outcome }}
          PATHS_OUTCOME: ${{ steps.paths.outcome }}
        shell: bash
        run: |
          {
            echo '## Temporary Practice validation result'
            echo
            echo "- Validator: **${VALIDATOR_OUTCOME}**"
            echo "- Whitespace: **${WHITESPACE_OUTCOME}**"
            echo "- Paths/protected sources: **${PATHS_OUTCOME}**"
            echo
            echo '<details><summary>Validator output</summary>'
            echo
            echo '```text'
            cat /tmp/practice-validator.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } > /tmp/practice-validation-comment.md
          gh pr comment 88 --repo Tradition-Learning-Community/tllib-specs --body-file /tmp/practice-validation-comment.md
      - name: Enforce successful result
        if: steps.validator.outcome != 'success' || steps.whitespace.outcome != 'success' || steps.paths.outcome != 'success'
        run: exit 1
