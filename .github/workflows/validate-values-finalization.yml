name: validate-values-finalization
on:
  push:
    branches: [phase4/values-domain-finalization-001]
  pull_request:
    paths:
      - 'registry/domain-finalization/values/**'
      - 'registry/optimized-ir/values/**'
      - 'registry/algorithms/values/**'
      - 'registry/oracles/values/**'
      - 'reports/domain-finalization/values/**'
      - 'tools/domain-finalization/validate_values_finalization.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - run: python tools/domain-finalization/validate_values_finalization.py
      - run: git diff --check HEAD^
      - run: test -z "$(git diff --name-only HEAD^ HEAD | grep '^maths/' || true)"
